function installConfettiFallback() {

        if (Array.isArray(q.tfValues) && q.tfValues.length === 4) return true;
        if (/Điền\s+Đ\s*\(?Đúng\)?\s*hoặc\s+S\s*\(?Sai\)?/i.test(String(q.q || ""))) return true;

    window.getTf4Expected = function(q) {
        if (!q) return ["Đ", "S", "Đ", "S"];
        if (Array.isArray(q.tfValues) && q.tfValues.length === 4) {
            return q.tfValues.map(function(v) {
                var s = String(v || "").trim().toUpperCase();
                return (s === "S" || s === "SAI" || s === "FALSE" || s === "F" || s === "0") ? "S" : "Đ";
            });
        }
        var ansArr = Array.isArray(q.answers) ? q.answers.map(Number) : [Number(q.answer) || 0];
        return [0, 1, 2, 3].map(function(i) {
            return ansArr.indexOf(i) >= 0 ? "Đ" : "S";
        });
    };

    window.getTf4SummaryText = function(q) {
        var exp = window.getTf4Expected(q);
        var L = ["A", "B", "C", "D"];

    window.getTf4SpeechText = function(q) {

    function normalizeBlankAns(s) {
        return String(s || "").trim().toLowerCase()
            .replace(/^[a-z]\s*=\s*/i, "")
            .replace(/\s+/g, " ")
            .replace(/,/g, ".");

    window.checkBlankUserAnswer = function(q, userStr) {
        var u = normalizeBlankAns(userStr);
        if (!u) return false;
        var candidates = [];
        if (Array.isArray(q.blanks)) candidates = candidates.concat(q.blanks);
        if (q.rawBlankAnswer) candidates.push(q.rawBlankAnswer);
        if (Array.isArray(q.options) && q.options[q.answer] !== undefined) candidates.push(q.options[q.answer]);
        if (typeof q.answer === "string") candidates.push(q.answer);
        for (var i = 0; i < candidates.length; i++) {
            var c = normalizeBlankAns(candidates[i]);

            }

function latexLite(input) {

        s = s.replace(/\$\$([\s\S]+?)\$\$/g, ' $1 ');

            if (/^[A-Z]['\u2019\u2032]{0,2}(?:\.[A-Z]['\u2019\u2032]{0,2}|[A-Z]['\u2019\u2032]{0,2}){0,7}$/.test(s)) return true;

        };

        window.isEduGameEnglishWord = function(rawWord) {
            if (!rawWord) return false;
            var s = String(rawWord).trim();
            if (!s || VI_DIAC_RE.test(s)) return false;
            if (window.isEduGameMathGeoToken && window.isEduGameMathGeoToken(s)) return false;
            var w = s.replace(/^[^A-Za-z0-9'\u2019]+|[^A-Za-z0-9'\u2019]+$/g, '');
            if (!w) return false;
            // Nếu toàn chữ in hoa từ 1-6 ký tự (VD: ABC, ABCD, MNPQ, AB, BC) -> Ký hiệu hình học/viết tắt, không phải từ tiếng Anh thường
            if (/^[A-Z]{1,6}$/.test(w)) return false;

            if (MATH_OR_UNIT_TOKEN_RE.test(wl)) return false;
            // Chỉ nhận diện từ viết tắt tiếng Anh thật sự (don't, doesn't, isn't, I'm, you're, we've, I'll, he's, o'clock)

            }

            if (VI_UNACCENTED_SET[wl]) return false;

            if (/[bdfgklrsvxz]$/.test(wl)) return true;
            if (/[bcdfghjklmnpqrstvwxz]e$/.test(wl) && !/^(?:me|le|tre|xe|nghe|che|khe|nhe|phe|the|ve)$/.test(wl)) return true;

        window.detectEduGameTextLang = function(text, forcedMode) {
            var mode = forcedMode || (typeof window.getEduGameTtsLangMode === 'function' ? window.getEduGameTtsLangMode() : 'auto');
            if (mode === 'en-US' || mode === 'en-GB' || mode === 'en-AU') return 'en';
            if (mode === 'vi-VN') return 'vi';
            if (!text) return 'vi';
            var s = String(text).replace(/<[^>]*>/g, ' ').trim();
            if (!s) return 'vi';
            // Loại bỏ các nhãn bọc mặc định của trò chơi trước khi đo tỷ lệ ngôn ngữ
            var stripped = s
                .replace(/^\s*(?:Mảnh\s*ghép\s*số\s*\d+\s*[\.\:\-]?\s*)?(?:Câu\s*hỏi\s*(?:số)?|Câu|Bài|Phần|Question|Q|Option)\s*\d*\s*[\.\:\-\,]?\s*/i, '')
                .replace(/(?:Đáp\s*án\s*(?:chính\s*xác\s*là)?|Option)\s*[A-D1-4]?\s*[\.\:\,]?\s*/gi, ' ')
                .replace(/(?:Chính\s*xác|Đúng\s*rồi)\s*!?\s*/gi, ' ')

        window.prepareEnglishSpeechText = function(inputStr) {
            if (inputStr === null || inputStr === undefined) return '';
            var s = String(inputStr).replace(/<[^>]*>/g, ' ');
            // Chuẩn hóa dấu nháy đơn trong từ viết tắt tiếng Anh (don’t -> don't, I’m -> I'm, she’s -> she's)
            s = s.replace(/([A-Za-z])[\u2018\u2019\u2032\u0060]([A-Za-z])/g, "$1'$2");
            // Loại bỏ ký hiệu LaTeX bao ngoài

            s = s.replace(/\$([^\$\r\n]+?)\$/g, ' $1 ');

            // Chuyển các nhãn bọc câu hỏi/đáp án tiếng Việt sang tiếng Anh tự nhiên khi ở trong ngữ cảnh câu tiếng Anh
            s = s.replace(/^\s*Mảnh\s*ghép\s*số\s*(\d+)\s*[\.\:\-]?\s*Câu\s*hỏi\s*[\.\:\-]?\s*/i, 'Tile $1. Question: ');
            s = s.replace(/^\s*(?:Câu\s*hỏi\s*số|Câu\s*số|Câu|Bài|Question|Q)\s*(\d+)\s*[\.\:\-\,]?\s*/i, 'Question $1. ');
            s = s.replace(/^\s*Câu\s*hỏi\s*[\.\:\-\,]\s*/i, 'Question: ');
            s = s.replace(/^\s*Chính\s*xác\s*!\s*/i, 'Correct! ');
            s = s.replace(/Đáp\s*án\s*chính\s*xác\s*là\s*[\.\:\-]?\s*/gi, 'The correct answer is ');
            s = s.replace(/Đáp\s*án\s+([A-D1-4])\s*[\.\:\,]\s*/gi, 'Option $1, ');

            // Chỗ trống điền khuyết: ___(1)___, (1) ___, ___, [...], (___), ...
            s = s.replace(/_{2,}\s*\(\s*(\d+)\s*\)\s*_{0,}|\(\s*(\d+)\s*\)\s*_{2,}/g, function(m, d1, d2) {
                return ', blank ' + (d1 || d2) + ', ';
            });
            s = s.replace(/\[\s*_{2,}\s*\]|\(\s*_{2,}\s*\)|\{\s*_{2,}\s*\}|\[\s*\.{2,}\s*\]|\(\s*\.{2,}\s*\)|_{2,}|\.{3,}/g, ', blank, ');

            // Phiên âm quốc tế IPA & hậu tố ngữ âm (-ed, -s, -es)

            s = s.replace(/\/([ɪiːeæɑɒɔʊuʌɜəaɪeɪɔɪaʊəʊɪəeəʊəptkbdgfvθðszʃʒhmnŋlrjwːˈˌ]{1,6})\//g, ' $1 ');

            // Dấu gạch chéo tiếng Anh thông dụng
            s = s.replace(/\bhe\s*\/\s*she\b/gi, 'he or she');
            s = s.replace(/\bshe\s*\/\s*he\b/gi, 'she or he');
            s = s.replace(/\bs\s*\/\s*he\b/gi, 'he or she');
            s = s.replace(/\bhis\s*\/\s*her\b/gi, 'his or her');
            s = s.replace(/\bher\s*\/\s*his\b/gi, 'her or his');
            s = s.replace(/\bhim\s*\/\s*her\b/gi, 'him or her');
            s = s.replace(/\band\s*\/\s*or\b/gi, 'and or');
            s = s.replace(/\btrue\s*\/\s*false\b/gi, 'True or False');
            s = s.replace(/\byes\s*\/\s*no\b/gi, 'Yes or No');
            s = s.replace(/\bA\s*\/\s*B\s*\/\s*C\s*\/\s*D\b/g, 'A, B, C, or D');
            s = s.replace(/\bkm\s*\/\s*h\b/gi, 'kilometers per hour');
            s = s.replace(/\bm\s*\/\s*s\b/gi, 'meters per second');
            s = s.replace(/\b1\s*\/\s*2\b/g, 'one half');
            s = s.replace(/\b1\s*\/\s*4\b/g, 'one quarter');
            s = s.replace(/\b3\s*\/\s*4\b/g, 'three quarters');
            s = s.replace(/\b1\s*\/\s*3\b/g, 'one third');
            s = s.replace(/\b2\s*\/\s*3\b/g, 'two thirds');
            s = s.replace(/\b([A-Za-z]{2,})\s*\/\s*([A-Za-z]{2,})\b/g, '$1 or $2');

            // Từ viết tắt & danh xưng chuẩn Quốc tế
            s = s.replace(/\bMr\.\s*/g, 'Mister ');
            s = s.replace(/\bMrs\.\s*/g, 'Misses ');
            s = s.replace(/\bMs\.\s*/g, 'Miz ');
            s = s.replace(/\bDr\.\s*/g, 'Doctor ');
            s = s.replace(/\bProf\.\s*/g, 'Professor ');
            s = s.replace(/\bSt\.\s+([A-Z])/g, 'Saint $1');
            s = s.replace(/\be\.g\.\s*,?/gi, 'for example, ');
            s = s.replace(/\bi\.e\.\s*,?/gi, 'that is, ');
            s = s.replace(/\betc\.(?!\w)/gi, 'et cetera');

            s = s.replace(/€(\d+(?:\.\d+)?)/g, '$1 euros');
            s = s.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)\s*C\b/gi, '$1 degrees Celsius');
            s = s.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)\s*F\b/gi, '$1 degrees Fahrenheit');
            s = s.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)(?![A-Za-z0-9])/g, '$1 degrees');
            s = s.replace(/(\d+)\s*%/g, '$1 percent');
            s = s.replace(/(\d+)\s*\+\s*(\d+)/g, '$1 plus $2');
            s = s.replace(/(\d+)\s*[×✕\*]\s*(\d+)/g, '$1 times $2');
            s = s.replace(/(\d+)\s*[÷]\s*(\d+)/g, '$1 divided by $2');
            s = s.replace(/(\d+)\s*-\s*(\d+)/g, '$1 minus $2');
            s = s.replace(/=\s*\?/g, ' equals what? ');
            s = s.replace(/(\d+)\s*=\s*(\d+)/g, '$1 equals $2');

            // Nhãn đáp án A. B. C. D. hoặc (A) (B) (C) (D) -> ngắt nhịp tự nhiên
            s = s.replace(/(?:^|\s+)\(\s*([A-D])\s*\)\s+/g, '. $1, ');
            s = s.replace(/(?:^|\s+)([A-D])\s*[\.\)]\s+/g, '. $1, ');

            // Động từ trong ngoặc ở bài tập chia động từ: "She (go) ___ to school" -> "She, go, blank, to school"
            s = s.replace(/\(\s*([^()]{1,40})\s*\)/g, ', $1, ');

                 .replace(/:\s*\./g, ':')
                 .replace(/(?:\s*,\s*){2,}/g, ', ')
                 .replace(/(?:\s*\.\s*){2,}/g, '. ')
                 .replace(/\.\s*,/g, '.')
                 .replace(/,\s*\./g, '.')
                 .replace(/^\s*[,.\s]+/, '')
                 .trim();
            return s;
        };

        window.splitEduGameBilingualSegments = function(rawInput, forcedMode) {
            var mode = forcedMode || (typeof window.getEduGameTtsLangMode === 'function' ? window.getEduGameTtsLangMode() : 'auto');
            var accent = (mode === 'en-GB' || mode === 'auto-uk') ? 'en-GB' : (mode === 'en-AU' ? 'en-AU' : 'en-US');
            var cloudTl = (accent === 'en-GB') ? 'en-GB' : (accent === 'en-AU' ? 'en-AU' : 'en');
            var s = String(rawInput === null || rawInput === undefined ? '' : rawInput).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            if (!s) return [];

            if (mode === 'en-US' || mode === 'en-GB' || mode === 'en-AU') {
                return [{ lang: 'en', accent: accent, cloudTl: cloudTl, text: window.prepareEnglishSpeechText(s) }];
            }
            if (mode === 'vi-VN') {
                return [{ lang: 'vi', accent: 'vi-VN', cloudTl: 'vi', text: window.mathToSpeechViCore(s) }];
            }

            // Tiền xử lý: Nếu phần lựa chọn "Đáp án A, ... Đáp án B, ..." có nội dung tiếng Anh thì đổi nhãn "Đáp án X" sang "Option X" để đọc liền mạch
            var optMatches = s.match(/Đáp\s*án\s+[A-D1-4]\s*[\.\:\,]\s*([^\.\;\!\?]+)/gi);
            if (optMatches && optMatches.length >= 2) {
                var enOptCount = 0;
                for (var oi = 0; oi < optMatches.length; oi++) {
                    var optBody = optMatches[oi].replace(/^Đáp\s*án\s+[A-D1-4]\s*[\.\:\,]\s*/i, '').trim();
                    if (window.detectEduGameTextLang(optBody, 'auto') === 'en') enOptCount++;
                }

                    s = s.replace(/Đáp\s*án\s+([A-D1-4])\s*[\.\:\,]\s*/gi, 'Option $1, ');
                }
            }

            // Nếu toàn câu (sau khi bỏ nhãn "Câu 1:") là tiếng Anh thuần túy -> gom thành 1 segment tiếng Anh duy nhất
            var hasViDiac = VI_DIAC_RE.test(
                s.replace(/^\s*(?:Mảnh\s*ghép\s*số\s*\d+\s*[\.\:\-]?\s*)?(?:Câu\s*hỏi\s*(?:số)?|Câu|Bài|Phần)\s*\d*\s*[\.\:\-\,]?\s*/i, '')
                 .replace(/Chính\s*xác\s*!?\s*/gi, '')
                 .replace(/Đáp\s*án\s*(?:chính\s*xác\s*là)?\s*[A-D1-4]?\s*[\.\:\,]?\s*/gi, '')
            );
            if (!hasViDiac && window.detectEduGameTextLang(s, 'auto') === 'en') {
                return [{ lang: 'en', accent: accent, cloudTl: cloudTl, text: window.prepareEnglishSpeechText(s) }];
            }

            // Tách câu song ngữ theo dấu ngắt mệnh đề (:, ., ?, !, ;, —, hoặc trước Option A / A.) và từ tiếng Anh trong ngoặc kép
            // LƯU Ý: Không tách theo dấu nháy đơn ' đứng sau chữ cái (như xx', yy', x'Oy', A'B'C') vì đó là dấu phẩy hình học!
            var rawClauses = s
                .replace(/(\s+)(?=(?:Option\s+[A-D1-4]|[A-D]\s*[\.\)])\s+)/g, ' |egsplit| ')

                .replace(/\b(Mr|Mrs|Ms|Miss|Dr|Prof|St|Jr|Sr|vs|etc)\.\s+/gi, '$1_EGDOT_ ')

                .split(/\s*\|egsplit\|\s*/);

            var rawSegs = [];
            for (var ci = 0; ci < rawClauses.length; ci++) {
                var cl = rawClauses[ci].trim();
                if (!cl) continue;
                var clLang = window.detectEduGameTextLang(cl, 'auto');
                // Nếu mệnh đề đầu chỉ là "Câu 1:" hoặc "Câu hỏi số 1:" mà mệnh đề ngay sau là tiếng Anh -> gộp sang tiếng Anh
                if (ci === 0 && clLang === 'vi' && rawClauses.length > 1 && /^\s*(?:Mảnh\s*ghép\s*số\s*\d+\s*[\.\:\-]?\s*)?(?:Câu\s*hỏi\s*(?:số)?|Câu|Bài)\s*\d*\s*[\.\:\-\,]?\s*$/i.test(cl)) {
                    var nextLang = window.detectEduGameTextLang(rawClauses[1], 'auto');
                    if (nextLang === 'en') clLang = 'en';

        };

        window.splitEduGameSpeechChunks = function(text, maxLen) {
            maxLen = maxLen || 165;

            var out = [];
            for (var i = 0; i < segs.length; i++) {
                var s = segs[i].text;
                if (s.length <= maxLen) {
                    out.push(s);
                } else {
                    var parts = s.split(/([.,:;!?]+)/);
                    var cur = '';
                    for (var j = 0; j < parts.length; j += 2) {
                        var piece = parts[j] + (parts[j + 1] || '');
                        if ((cur + piece).length <= maxLen) {
                            cur += piece;
                        } else {
                            if (cur.trim()) out.push(cur.trim());
                            if (piece.length <= maxLen) {
                                cur = piece;
                            } else {
                                var words = piece.split(/\s+/);
                                cur = '';
                                for (var w = 0; w < words.length; w++) {
                                    if ((cur + ' ' + words[w]).trim().length <= maxLen) {
                                        cur = (cur + ' ' + words[w]).trim();
                                    } else {
                                        if (cur.trim()) out.push(cur.trim());
                                        cur = words[w];
                                    }
                                }
                            }
                        }
                    }
                    if (cur.trim()) out.push(cur.trim());
                }
            }
            return out.length ? out : [String(text || '').trim()].filter(Boolean);
        };

        window.pickBestEduGameEnglishVoice = function(preferredAccent, explicitVoiceName) {
            if (!window.speechSynthesis || typeof window.speechSynthesis.getVoices !== 'function') return null;
            var vs = window.speechSynthesis.getVoices() || [];
            if (!vs.length) return null;
            if (explicitVoiceName && explicitVoiceName !== 'google_cloud') {
                var exp = null;
                for (var k = 0; k < vs.length; k++) {
                    if (vs[k].name === explicitVoiceName || vs[k].voiceURI === explicitVoiceName) { exp = vs[k]; break; }
                }
                if (exp && (/^en/i.test(String(exp.lang || '')) || /english/i.test(String(exp.name || '')))) {
                    return exp;
                }
            }
            var target = preferredAccent || 'en-US';
            var best = null, bestScore = -1;
            for (var i = 0; i < vs.length; i++) {
                var v = vs[i];
                var lang = String(v.lang || '').toLowerCase();
                var name = String(v.name || '').toLowerCase();
                if (!lang.startsWith('en') && name.indexOf('english') === -1) continue;
                var score = 10;
                if (name.indexOf('natural') !== -1 || name.indexOf('neural') !== -1 || name.indexOf('online') !== -1) score += 100;
                if (/aria|jenny|ava\b|emma\b|sonia|libby|ryan|guy|andrew|brian|natasha|william/.test(name)) score += 30;
                if (name.indexOf('google us english') !== -1 || name.indexOf('google uk english female') !== -1) score += 95;
                else if (name.indexOf('google uk english') !== -1 || name.indexOf('google') !== -1) score += 85;
                if (/samantha|daniel|karen|ava|allison|serena|alex|moira|premium|enhanced/.test(name)) score += 75;
                if (target === 'en-GB') {
                    if (lang.indexOf('gb') !== -1 || lang.indexOf('uk') !== -1 || /united kingdom|\buk\b|british|sonia|libby|ryan|thomas|maisie|hazel|daniel|serena|george|susan/.test(name)) score += 55;
                } else if (target === 'en-AU') {
                    if (lang.indexOf('au') !== -1 || /australia|natasha|william|karen|catherine|lee/.test(name)) score += 55;
                } else {
                    if (lang.indexOf('us') !== -1 || /united states|\bus\b|aria|jenny|ava\b|guy|andrew|brian|christopher|eric|michelle|ana\b|zira|david|mark|samantha|allison|alex/.test(name)) score += 55;
                }
                if (score > bestScore) { bestScore = score; best = v; }
            }
            return best;
        };
    }

    if (input === null || input === undefined) return '';
    if (!window.mathToSpeechViCore) {
        window.mathToSpeechViCore = function(rawViInput) {
            if (rawViInput === null || rawViInput === undefined) return '';
            var t = (typeof cleanMathUnicode === 'function' ? cleanMathUnicode(rawViInput) : String(rawViInput));

            // Bảng phiên âm chuẩn 100% tên chữ cái Toán học & Hình học Việt Nam (Lớp 1 - Lớp 12)
            var VI_MATH_CHAR = {
                'A': 'a', 'B': 'bê', 'C': 'xê', 'D': 'đê', 'E': 'e', 'F': 'ép', 'G': 'gờ',
                'H': 'hát', 'I': 'i', 'J': 'gi', 'K': 'ca', 'L': 'lờ', 'M': 'mờ', 'N': 'nờ',
                'O': 'ô', 'P': 'pê', 'Q': 'quy', 'R': 'rờ', 'S': 'ét', 'T': 'tê', 'U': 'u',
                'V': 'vê', 'W': 'vê kép', 'X': 'ích', 'Y': 'y', 'Z': 'dét',
                'Ô': 'ô', 'Â': 'a', 'Ê': 'e'
            };
            var SUB_DIGIT_MAP = {
                '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'
            };

            function spellGeoTokenVi(tok) {
                if (!tok) return '';
                var norm = String(tok)
                    .replace(/[\u2018\u2019\u2032\u02BC\u0060]/g, "'")
                    .replace(/\u2033/g, "''");
                var dotParts = norm.split('.');
                var renderedParts = [];
                for (var dp = 0; dp < dotParts.length; dp++) {
                    var part = dotParts[dp];
                    var words = [];
                    var i = 0;
                    while (i < part.length) {
                        var ch = part.charAt(i);
                        if (ch === "'") {
                            if (part.charAt(i + 1) === "'") {
                                words.push('hai phẩy');
                                i += 2;
                            } else {
                                words.push('phẩy');
                                i++;
                            }
                        } else if (SUB_DIGIT_MAP[ch]) {
                            words.push(SUB_DIGIT_MAP[ch]);
                            i++;
                        } else if (/[0-9]/.test(ch)) {
                            var numStr = ch;
                            while (i + 1 < part.length && /[0-9]/.test(part.charAt(i + 1))) {
                                i++;
                                numStr += part.charAt(i);
                            }
                            words.push(numStr);
                            i++;
                        } else {
                            var up = ch.toUpperCase();
                            if (VI_MATH_CHAR[up]) {
                                words.push(VI_MATH_CHAR[up]);
                            } else if (ch !== ' ') {
                                words.push(ch);
                            }
                            i++;
                        }
                    }
                    if (words.length) renderedParts.push(words.join(' '));
                }
                if (renderedParts.length > 1) {
                    var firstAlphaLen = dotParts[0].replace(/[^A-Za-z]/g, '').length;
                    return renderedParts.join(firstAlphaLen >= 3 ? ', ' : ' ');
                }
                return renderedParts[0] || '';
            }

            // Chuẩn hóa dấu phẩy hình học (prime): ’, ′, ʻ -> '
            t = t.replace(/[\u2018\u2019\u2032\u02BC\u0060]/g, "'").replace(/\u2033/g, "''");

            // 0. Chuẩn hóa sơ bộ LaTeX và phân loại nhãn câu
            t = t.replace(/\$\$([\s\S]+?)\$\$/g, ' $1 ');
            t = t.replace(/\$([^\$\r\n]+?)\$/g, ' $1 ');
            t = t.replace(/\\\(|\\\)|\\\[|\\\]/g, ' ');
            t = t.replace(/\\\\/g, ' ');

            // Tránh nhầm lẫn nhãn bài tập ("Câu 1:", "Bài 2.") thành phép chia và đọc chuẩn "Đáp án A/B/C/D"
            t = t.replace(/(Câu|Bài|Ví dụ|Phần|Bước)\s*(\d+)\s*[:.]/gi, '$1 $2, ');
            t = t.replace(/Đáp\s*án\s+chính\s*xác\s*là\s*[:.]?\s*([A-D])(?![A-Za-zÀ-ỹ])/gi, function(m, opt) {
                return 'Đáp án chính xác là ' + (VI_MATH_CHAR[opt.toUpperCase()] || opt) + ', ';
            });
            t = t.replace(/Đáp\s*án\s*([A-D])(?![A-Za-zÀ-ỹ])\s*[:.,]?/gi, function(m, opt) {
                return 'Đáp án ' + (VI_MATH_CHAR[opt.toUpperCase()] || opt) + ', ';
            });

            // 0a. Quy tắc đọc Số La Mã chuẩn từng chữ cái (VD: XIX -> "ích i ích", XXIV -> "ích ích i vê")
            var ROMAN_CHAR_READ = { 'I': 'i', 'V': 'vê', 'X': 'ích', 'L': 'lờ', 'C': 'xê', 'D': 'đê', 'M': 'mờ' };
            var hasLaMaContext = /la\s*mã/i.test(t);
            t = t.replace(/\b(loại|phần|học\s*kỳ|kỳ)\s+I\b(?![IVXLCDM'])/gi, '$1 1');
            t = t.replace(/\b(loại|phần|học\s*kỳ|kỳ)\s+II\b(?![IVXLCDM'])/gi, '$1 2');
            t = t.replace(/\b(loại|phần|học\s*kỳ|kỳ)\s+III\b(?![IVXLCDM'])/gi, '$1 3');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ'])([IVXLCDM]{2,})(?![A-Za-zÀ-ỹ'\.])/g, function(m, pre, rom) {
                if (!/^(?:II|III|IV|VI|VII|VIII|IX|XI|XII|XIII|XIV|XV|XVI|XVII|XVIII|XIX|XX|XXI|XXII|XXIV|XXV|XXVI)$/.test(rom) && !hasLaMaContext) {
                    return m;
                }
                return (pre || '') + ' ' + rom.split('').map(function(ch) { return ROMAN_CHAR_READ[ch] || ch; }).join(' ') + ' ';
            });
            if (hasLaMaContext) {
                t = t.replace(/(^|[^A-Za-zÀ-ỹ'])([IVXLM])(?![A-Za-zÀ-ỹ'])/g, function(m, pre, ch) {
                    return (pre || '') + ' ' + (ROMAN_CHAR_READ[ch] || ch) + ' ';
                });
            }

            // Tránh nhầm ngày tháng năm (25/10/2026) thành phân số
            t = t.replace(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g, '$1 tháng $2 năm $3');

            // 0b. Điền khuyết: [___], [...], (___) -> "chỗ trống"
            t = t.replace(/\[\s*_{2,}\s*\]|\[\s*\.{2,}\s*\]|\(\s*_{2,}\s*\)|\b_{3,}\b/g, ' chỗ trống ');

            // 0c. Ký hiệu viết tắt chuẩn SGK Toán Việt Nam (ƯCLN, BCNN, ƯC, BC)
            // LƯU Ý: "BC" không có ngoặc chỉ đọc là "bội chung" khi đi kèm từ khóa chia hết/ước/bội, tránh nhầm cạnh BC của tam giác ABC!
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])ƯCLN\s*\(\s*([0-9a-zA-Z]+)\s*[,;]\s*([0-9a-zA-Z]+)\s*\)/g, '$1 ước chung lớn nhất của $2 và $3 ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])ƯCLN(?![A-Za-zÀ-ỹ0-9_])/g, '$1 ước chung lớn nhất ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])BCNN\s*\(\s*([0-9a-zA-Z]+)\s*[,;]\s*([0-9a-zA-Z]+)\s*\)/g, '$1 bội chung nhỏ nhất của $2 và $3 ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])BCNN(?![A-Za-zÀ-ỹ0-9_])/g, '$1 bội chung nhỏ nhất ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])ƯC\s*\(\s*([0-9a-zA-Z]+)\s*[,;]\s*([0-9a-zA-Z]+)\s*\)/g, '$1 ước chung của $2 và $3 ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])ƯC(?![A-Za-zÀ-ỹ0-9_])/g, '$1 ước chung ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])BC\s*\(\s*(\d+)\s*[,;]\s*(\d+)\s*\)/g, '$1 bội chung của $2 và $3 ');
            t = t.replace(/(tìm|tập\s*hợp|các)\s+BC\s+của\b/gi, '$1 bội chung của');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9_])Ư\s*\(\s*(\d+)\s*\)/g, '$1 các ước của $2 ');
            t = t.replace(/(tìm|tập\s*hợp)\s+B\s*\(\s*(\d+)\s*\)/gi, '$1 các bội của $2 ');

            // 0d. Chia hết & Không chia hết
            t = t.replace(/\\vdots|⋮/g, ' chia hết cho ');
            t = t.replace(/\\nmid|\\not\\vdots|∤/g, ' không chia hết cho ');

            // 0e. Trị tuyệt đối & Độ dài vectơ: |x|, |-5|, |\vec{AB}|
            t = t.replace(/\|([^|]+)\|/g, function(m, inner) {
                return ' giá trị tuyệt đối của ' + inner.trim() + ' ';
            });

            // 0f. Đồng dạng & bằng nhau hình học
            t = t.replace(/\\sim|∽/g, ' đồng dạng với ');
            t = t.replace(/\\cong|≅/g, ' bằng ');

            // 1. Phân số LaTeX \frac{a}{b} hoặc \dfrac{a}{b}
            var prev;
            do {
                prev = t;
                t = t.replace(/\\(?:[dt]?frac)\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, function(m, a, b) {
                    a = a.trim(); b = b.trim();
                    if (a === '1' && b === '2') return ' một phần hai ';
                    if (a === '1' && b === '4') return ' một phần tư ';
                    if (a === '3' && b === '4') return ' ba phần tư ';
                    if (/^[0-9A-Za-z]+$/.test(a) && /^[0-9A-Za-z]+$/.test(b)) return a + ' phần ' + b + ' ';
                    return ' mở ngoặc ' + a + ' đóng ngoặc trên mở ngoặc ' + b + ' đóng ngoặc ';
                });
            } while (t !== prev);

            // 2. HỆ THỐNG ĐỌC CHUẨN 100% NGÔN NGỮ HÌNH HỌC & TOÁN HỌC (LỚP 1 -> LỚP 12)
            // 2a. Ký hiệu "sđ" -> "số đo" (VD: sđ góc xOy, sđ cung AB)
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])sđ\s*(?=góc|cung|∠|\\angle|\\widehat)/gi, '$1 số đo ');

            // 2b. Đường tròn (O; R), (O; 5cm), (O)
            t = t.replace(/(đường\s+tròn|hình\s+tròn)\s*\(\s*([A-Z]'?)\s*[;,]\s*([^()]+)\)/gi, function(m, kw, center, rad) {
                return kw + ' tâm ' + spellGeoTokenVi(center) + ' bán kính ' + rad.trim() + ' ';
            });
            t = t.replace(/(đường\s+tròn|hình\s+tròn)\s*\(\s*([A-Z]'?)\s*\)/gi, function(m, kw, center) {
                return kw + ' tâm ' + spellGeoTokenVi(center) + ' ';
            });

            // 2c. Vectơ: \vec{AB}, \overrightarrow{AB}, vectơ AB, vectơ u, \vec{a}
            t = t.replace(/(?:vectơ\s*|vector\s*)?\\(?:vec|overrightarrow)\s*\{([A-Za-z0-9']+)\}/gi, function(m, v) {
                return ' vectơ ' + spellGeoTokenVi(v) + ' ';
            });
            t = t.replace(/(?:vectơ\s*|vector\s*)?\\vec\s*([A-Za-z0-9'])/gi, function(m, v) {
                return ' vectơ ' + spellGeoTokenVi(v) + ' ';
            });
            t = t.replace(/\b(?:vectơ|vector)\s+([A-Z]{1,2}'?(?:[A-Z]'?)?|[abcuvxyz]'?)(?![A-Za-zÀ-ỹ])/gi, function(m, v) {
                return ' vectơ ' + spellGeoTokenVi(v) + ' ';
            });

            // 2d. Tam giác & Biệt thức Delta: \Delta ABC, △ABC, ΔABC, ΔA'B'C' vs đường thẳng Δ, Δ = b² - 4ac
            t = t.replace(/(?:tam\s*giác\s*)?(?:\\Delta|\\triangle|[△Δ])\s*([A-Z]'?[A-Z]'?[A-Z]'?)(?![A-Za-zÀ-ỹ])/g, function(m, name) {
                return ' tam giác ' + spellGeoTokenVi(name) + ' ';
            });
            t = t.replace(/(?:tam\s*giác\s*)?△/g, ' tam giác ');
            t = t.replace(/Δ''/g, ' đen ta hai phẩy ');
            t = t.replace(/Δ'/g, ' đen ta phẩy ');
            t = t.replace(/\\Delta\b|Δ/g, ' đen ta ');

            // 2e. Ký hiệu góc: \angle, ∠, \widehat{...}, \hat{...} (hỗ trợ cả góc xOy, x'Oy', ABC, A)
            t = t.replace(/(?:góc\s*)?(?:\\angle|∠|\\widehat|\\hat)\s*\{?\s*([A-Za-z][A-Za-z0-9']{0,6})\s*\}?/g, function(m, name) {
                return ' góc ' + spellGeoTokenVi(name) + ' ';
            });

            // 2f. Hai đường thẳng cắt nhau / song song có tên chữ thường lặp hoặc có phẩy: xx', yy', zz', tt', aa', bb', cc', dd', mm', nn'
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([xyztabcdmn])\2\s*('{1,2})(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, ch, pr) {
                return (pre || '') + ' ' + spellGeoTokenVi(ch + ch + pr) + ' ';
            });
            t = t.replace(/(đường\s+thẳng|hai\s+đường\s+thẳng)\s+([xyztabcdmn])\2(?![A-Za-zÀ-ỹ0-9'])/gi, function(m, kw, ch) {
                return kw + ' ' + spellGeoTokenVi(ch + ch) + ' ';
            });

            // 2g. Hệ trục tọa độ & Tia gốc O / A / B / C / I: Oxyz, Oxy, Oyz, Oxz, Ox', Oy', Oz', Ot', Ox, Oy, Oz, Ot, Ax, Ay, Bx, By
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])Oxyz(?![A-Za-zÀ-ỹ0-9])/g, '$1 ô ích y dét ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])Oxy(?![A-Za-zÀ-ỹ0-9])/g, '$1 ô ích y ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])Oyz(?![A-Za-zÀ-ỹ0-9])/g, '$1 ô y dét ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])Oxz(?![A-Za-zÀ-ỹ0-9])/g, '$1 ô ích dét ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([OABCIKMNP])([xyztuv])('{0,2})(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, root, ray, pr) {
                return (pre || '') + ' ' + spellGeoTokenVi(root + ray + pr) + ' ';
            });

            // 2h. Góc tạo bởi 2 tia: xOy, x'Oy', x'Oy, xOy', yOz, y'Oz', xOz, xOt, yOt, zOt, mOn, uOv, aOb, xAy, xBy, xÔy, x'Ôy', AÔB, BÂC
            t = t.replace(/(góc(?:\s+đối\s+đỉnh|\s+kề\s+bù|\s+kề|\s+bù|\s+phụ|\s+bẹt|\s+vuông|\s+nhọn|\s+tù)?\s+)?([xyztuvabmn])('{0,2})([OABCIKMNPÔÂÊ])([xyztuvabmn])('{0,2})(?![A-Za-zÀ-ỹ0-9])/g, function(m, kwPrefix, r1, p1, vMid, r2, p2) {
                var midPlain = (vMid === 'Ô') ? 'O' : ((vMid === 'Â') ? 'A' : ((vMid === 'Ê') ? 'E' : vMid));
                var hasCircumflex = (vMid === 'Ô' || vMid === 'Â' || vMid === 'Ê');
                var prefix = kwPrefix ? kwPrefix : (hasCircumflex ? ' góc ' : ' ');
                return prefix + spellGeoTokenVi(r1 + p1 + midPlain + r2 + p2) + ' ';
            });
            // Trường hợp GV gõ chữ thường toàn bộ sau chữ "góc": "góc xoy", "góc x'oy'", "góc yoz"
            t = t.replace(/(góc(?:\s+đối\s+đỉnh|\s+kề\s+bù|\s+kề|\s+bù|\s+phụ|\s+bẹt|\s+vuông|\s+nhọn|\s+tù)?)\s+([xyztuvabmn]'{0,2}[oabcikmnp][xyztuvabmn]'{0,2})(?![A-Za-zÀ-ỹ0-9])/gi, function(m, kw, ang) {
                return kw + ' ' + spellGeoTokenVi(ang) + ' ';
            });
            // Góc 3 chữ in hoa có mũ ở đỉnh giữa: AÔB, BÂC, AÊB
            t = t.replace(/(góc\s+)?([A-Z]'?)([ÔÂÊ])([A-Z]'?)(?![A-Za-zÀ-ỹ0-9])/g, function(m, kwPrefix, p1, vMid, p2) {
                var midPlain = (vMid === 'Ô') ? 'O' : ((vMid === 'Â') ? 'A' : 'E');
                return (kwPrefix || ' góc ') + spellGeoTokenVi(p1 + midPlain + p2) + ' ';
            });

            // 2i. Hình học không gian có dấu chấm: S.ABCD, S.ABC, O.ABC, ABC.A'B'C', ABCD.A'B'C'D'
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([A-Z]'{0,2}(?:[A-Z]'{0,2}){0,5})\.([A-Z]'{0,2}(?:[A-Z]'{0,2}){1,5})(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, leftP, rightP) {
                return (pre || '') + ' ' + spellGeoTokenVi(leftP + '.' + rightP) + ' ';
            });

            // 2j. Độ, phút, giây góc (60°30', 45°15'20") & nhiệt độ (°C, °F)
            t = t.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)\s*C\b/gi, '$1 độ xê ');
            t = t.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)\s*F\b/gi, '$1 độ ép ');
            t = t.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)\s*(\d+)\s*'\s*(\d+)\s*(?:''|")/g, '$1 độ $2 phút $3 giây ');
            t = t.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)\s*(\d+)\s*'(?![A-Za-z])/g, '$1 độ $2 phút ');
            t = t.replace(/(\d+)\s*(?:\^\{?\\?circ\}?|°)(?![A-Za-z0-9])/g, '$1 độ ');

            // 2k. Đạo hàm & Hàm số: f'(x), f''(x), g'(x), y'', y', f(x), g(x), P(x)
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([fghuvyFGHUVY])\s*''\s*\(\s*([^()]{1,20})\s*\)/g, function(m, pre, fn, arg) {
                return (pre || '') + ' ' + spellGeoTokenVi(fn) + ' hai phẩy mở ngoặc ' + arg + ' đóng ngoặc ';
            });
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([fghuvyFGHUVY])\s*'\s*\(\s*([^()]{1,20})\s*\)/g, function(m, pre, fn, arg) {
                return (pre || '') + ' ' + spellGeoTokenVi(fn) + ' phẩy mở ngoặc ' + arg + ' đóng ngoặc ';
            });
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([fghuvPQRST])\s*\(\s*([0-9a-zA-Z₀₁₂₃₄₅₆₇₈₉+\-*/,\s]{1,15})\s*\)/g, function(m, pre, fn, arg) {
                return (pre || '') + ' ' + spellGeoTokenVi(fn) + ' mở ngoặc ' + arg + ' đóng ngoặc ';
            });

            // 2l. Mọi ký hiệu điểm / đoạn / đa giác / đường thẳng có dấu phẩy (prime): A', B', C', M', O', A'B', A'B'C', A'B'C'D', AA', BB', CC', DD', d', a', b', x', y'
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([A-Za-z]{1,6}(?:'{1,2}[A-Za-z0-9₀₁₂₃₄₅₆₇₈₉]*)+)(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, tok) {
                return (pre || '') + ' ' + spellGeoTokenVi(tok) + ' ';
            });

            // 2m. Quan hệ hình học: vuông góc, song song, trùng nhau
            t = t.replace(/\\perp|⊥/g, ' vuông góc với ');
            t = t.replace(/\\parallel|∥/g, ' song song với ');
            t = t.replace(/(^|[^:])\/\//g, '$1 song song với ');
            t = t.replace(/\\equiv|≡/g, ' trùng với ');

            // 3. Đơn vị đo lường (xử lý TRƯỚC khi tách tên đoạn thẳng để 5cm -> 5 xăng ti mét, còn CM = 5cm -> xê mờ bằng 5 xăng ti mét)
            var UNIT = {
                km: 'ki lô mét',
                hm: 'héc tô mét',
                dam: 'đề ca mét',
                dm: 'đề xi mét',
                cm: 'xăng ti mét',
                mm: 'mi li mét',
                m: 'mét',
                kg: 'ki lô gam',
                hg: 'héc tô gam',
                dag: 'đề ca gam',
                g: 'gam',
                mg: 'mi li gam',
                ml: 'mi li lít',
                dl: 'đề xi lít',
                l: 'lít',
                ha: 'héc ta'
            };

            // Vận tốc
            t = t.replace(/\bkm\s*\/\s*h\b/gi, ' ki lô mét trên giờ ');
            t = t.replace(/\bm\s*\/\s*s\b/gi, ' mét trên giây ');
            t = t.replace(/\bcm\s*\/\s*s\b/gi, ' xăng ti mét trên giây ');

            // Diện tích và thể tích có số mũ
            t = t.replace(/(\d+)\s*(km|hm|dam|dm|cm|mm|m)\s*(?:²|\^\s*2)(?![0-9A-Za-z])/gi, function(m, d, u) {
                return d + ' ' + (UNIT[u.toLowerCase()] || u) + ' vuông ';
            });
            t = t.replace(/(\d+)\s*(km|hm|dam|dm|cm|mm|m)\s*(?:³|\^\s*3)(?![0-9A-Za-z])/gi, function(m, d, u) {
                return d + ' ' + (UNIT[u.toLowerCase()] || u) + ' khối ';
            });
            // Đơn vị diện tích/thể tích độc lập (VD: "đơn vị cm²", "tính bằng m³")
            t = t.replace(/(^|[\s(,:;])(km|hm|dam|dm|cm|mm|m)\s*(?:²|\^\s*2)(?![0-9A-Za-z])/gi, function(m, pre, u) {
                return (pre || '') + (UNIT[u.toLowerCase()] || u) + ' vuông ';
            });
            t = t.replace(/(^|[\s(,:;])(km|hm|dam|dm|cm|mm|m)\s*(?:³|\^\s*3)(?![0-9A-Za-z])/gi, function(m, pre, u) {
                return (pre || '') + (UNIT[u.toLowerCase()] || u) + ' khối ';
            });

            // Đơn vị đứng sau số
            t = t.replace(/(\d+)\s*(km|hm|dam|dm|cm|mm|kg|hg|dag|mg|ml|dl|ha)(?![0-9A-Za-z\u00C0-\u1EF9²³^])/gi, function(m, d, u) {
                return d + ' ' + (UNIT[u.toLowerCase()] || u) + ' ';
            });
            t = t.replace(/(\d+)\s*(m|g|l)(?=$|[\s.,;:?!)\]}\-+/=])/gi, function(m, d, u) {
                return d + ' ' + (UNIT[u.toLowerCase()] || u) + ' ';
            });

            // 2n. Tên hình / đoạn / góc / điểm / đường thẳng đứng ngay sau từ khóa Hình học
            var GEO_KW_RE = /\b(tam\s+giác(?:\s+vuông(?:\s+cân)?|\s+cân|\s+đều|\s+nhọn|\s+tù)?|tứ\s+giác(?:\s+nội\s+tiếp|\s+lồi)?|ngũ\s+giác|lục\s+giác(?:\s+đều)?|đa\s+giác(?:\s+đều)?|hình\s+vuông|hình\s+chữ\s+nhật|hình\s+bình\s+hành|hình\s+thoi|hình\s+thang(?:\s+vuông|\s+cân)?|hình\s+chóp(?:\s+đều|\s+tứ\s+giác|\s+tam\s+giác)?|tứ\s+diện(?:\s+đều)?|hình\s+lăng\s+trụ(?:\s+đứng|\s+đều)?|lăng\s+trụ(?:\s+đứng|\s+đều)?|hình\s+hộp(?:\s+chữ\s+nhật|\s+đứng)?|hình\s+lập\s+phương|đoạn\s+thẳng|đường\s+thẳng|tia(?:\s+phân\s+giác)?|cạnh(?:\s+bên|\s+đáy|\s+huyền|\s+góc\s+vuông)?|đường\s+cao|trung\s+tuyến|đường\s+trung\s+tuyến|phân\s+giác|đường\s+phân\s+giác|trung\s+trực|đường\s+trung\s+trực|đường\s+trung\s+bình|đường\s+chéo|đường\s+kính|bán\s+kính|dây\s+cung|dây|cung(?:\s+nhỏ|\s+lớn|\s+bị\s+chắn)?|tiếp\s+tuyến|cát\s+tuyến|góc(?:\s+đối\s+đỉnh|\s+kề\s+bù|\s+kề|\s+bù|\s+phụ|\s+bẹt|\s+vuông|\s+nhọn|\s+tù|\s+nội\s+tiếp|\s+ở\s+tâm|\s+ngoài|\s+trong|\s+so\s+le\s+trong|\s+đồng\s+vị|\s+đỉnh)?|đỉnh|điểm|tâm|trung\s+điểm|trọng\s+tâm|trực\s+tâm|giao\s+điểm|mặt\s+phẳng|mặt\s+cầu|cắt\s+nhau\s+tại|vuông\s+góc\s+tại|tiếp\s+xúc\s+tại|giao\s+nhau\s+tại|đi\s+qua|qua\s+điểm|tại\s+điểm)\s+([A-Z][A-Z0-9₀₁₂₃₄₅₆₇₈₉]{0,5}|[A-Z][a-z][A-Z]|[abcdmnkpqrhlxyzt][0-9₀₁₂₃₄₅₆₇₈₉]{0,2})(?![A-Za-zÀ-ỹ])/gi;
            t = t.replace(GEO_KW_RE, function(m, kw, tok) {
                return kw + ' ' + spellGeoTokenVi(tok) + ' ';

            // Danh sách tên đường thẳng / cạnh chữ thường nối tiếp nhau (VD: "hai đường thẳng a và b", "ba cạnh a, b, c")
            t = t.replace(/\b(đường\s+thẳng|cạnh|tia)\s+(a|bê|xê|đê|mờ|nờ|ca|pê|quy|rờ|hát|lờ|ích|y|dét|tê)((?:(?:\s*,\s*|\s+và\s+|\s+hoặc\s+|\s+với\s+)[abcdmnkpqrhlxyzt](?![A-Za-zÀ-ỹ0-9]))+)/gi, function(m, kw, firstSpoken, tail) {
                var convTail = tail.replace(/(^|[^A-Za-zÀ-ỹ0-9])([abcdmnkpqrhlxyzt])(?![A-Za-zÀ-ỹ0-9])/g, function(_, pre, ch) {
                    return (pre || '') + spellGeoTokenVi(ch);
                });
                return kw + ' ' + firstSpoken + convTail;
            });

            // 2o. Mọi cụm 2 - 6 chữ cái IN HOA biểu thị đoạn thẳng, tia, góc, tam giác, tứ giác, đa giác (AB, BC, AC, AH, MN, ABC, BAC, CAB, ABCD, MNPQ, DEF, SAB, SAC...)
            var ACRONYM_SKIP = {
                'THCS':1, 'THPT':1, 'PTDT':1, 'PTDTBT':1, 'GDPT':1, 'GDCD':1, 'KHTN':1, 'KHXH':1, 'CNTT':1, 'TDTT':1,
                'UBND':1, 'HĐND':1, 'TPHCM':1, 'ASEAN':1, 'UNESCO':1, 'UNICEF':1, 'NATO':1, 'COVID':1, 'AIDS':1, 'SARS':1,
                'HTML':1, 'HTTP':1, 'HTTPS':1, 'WIFI':1, 'SGK':1, 'SBT':1, 'SGV':1, 'BGH':1, 'ĐHQG':1, 'THPTQG':1,
                'CMND':1, 'CCCD':1, 'XHCN':1, 'TBCN':1, 'CNXH':1, 'ĐCSVN':1, 'USD':1, 'VND':1, 'EUR':1
            };
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([A-Z]{2,6})(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, tok) {
                if (ACRONYM_SKIP[tok]) return m;
                return (pre || '') + ' ' + spellGeoTokenVi(tok) + ' ';
            });

            // 4. Giới hạn & Lượng giác & Hàm số & Tổ hợp - Tích phân
            t = t.replace(/(?:giới\s*hạn\s*)?(?:\\lim|lim)\s*(?:_\s*\{([^}]*)\}|_\s*([0-9a-zA-Z\\→\->]+))?/gi, function(m, sub1, sub2) {
                var sub = sub1 || sub2;
                if (sub) {
                    sub = sub.replace(/\\to\b|->|→/g, ' tiến đến ');
                    return ' giới hạn khi ' + sub + ' của ';
                }
                return ' giới hạn ';
            });

            t = t.replace(/\\int\b|∫/g, ' tích phân ');
            t = t.replace(/\\sum\b|∑/g, ' tổng xích ma ');
            t = t.replace(/(\d+|[nmk])\s*!/g, '$1 giai thừa ');

            // Logarit có cơ số: \log_2(x), log_a(b), \log_{2} 8
            t = t.replace(/(?:\\log|\blog)\s*_\s*\{?([0-9a-zA-Z]+)\}?\s*(?:\(\s*([^()]+)\s*\)|([0-9a-zA-Z]+))/gi, function(m, base, arg1, arg2) {
                var a = arg1 || arg2;
                var bSpoken = /^[A-Za-z]$/.test(base) ? spellGeoTokenVi(base) : base;
                var aSpoken = /^[A-Za-z]$/.test(a) ? spellGeoTokenVi(a) : a;
                return ' lô ga rít cơ số ' + bSpoken + ' của ' + aSpoken + ' ';
            });

            t = t.replace(/\\sin\b|\bsin\b/gi, ' sin ');
            t = t.replace(/\\cos\b|\bcos\b/gi, ' cốt ');
            t = t.replace(/\\tan\b|\btan\b|\btg\b/gi, ' tang ');
            t = t.replace(/\\cot\b|\\cotan\b|\bcot\b|\bcotan\b|\bcotg\b/gi, ' cô tang ');
            t = t.replace(/\\ln\b|\bln\b/gi, ' lô ga rít tự nhiên của ');
            t = t.replace(/\\log\b|\blog\b/gi, ' lô ga rít ');

            // 5. Căn thức
            t = t.replace(/(?:căn bậc ba\s*(?:của\s*)?)?(?:\\sqrt\s*\[\s*3\s*\]\s*\{([^{}]*)\}|∛\(([^()]*)\)|∛([0-9a-zA-Z]+))/g, function(m, a, b, c) {

                return ' căn bậc ba của ' + v + ' ';
            });
            t = t.replace(/(?:căn bậc hai\s*(?:của\s*)?|căn\s*)?(?:\\sqrt\s*\{([^{}]*)\}|√\(([^()]*)\)|√([0-9a-zA-Z]+))/g, function(m, a, b, c) {
                var v = a || b || c;
                return ' căn bậc hai của ' + v + ' ';
            });

            // Tách biến dính liền sau số mũ (VD: R²h -> R² h, x²y³ -> x² y³) để đọc từng biến rõ ràng
            t = t.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹])([a-zA-Z])/g, '$1 $2');

            // 6. Lũy thừa và số mũ
            var SUP = {
                '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9',
                '⁺':'+','⁻':'-','⁼':'=','⁽':'(','⁾':')','ⁿ':'n','ˣ':'x','ʸ':'y','ᵃ':'a','ᵇ':'b',
                'ᶜ':'c','ᵐ':'m','ᵏ':'k','ⁱ':'i'
            };
            var SUP_CLASS = '[' + Object.keys(SUP).join('') + ']';

            function powerName(e) {
                e = String(e).trim();
                if (e === '0') return ' mũ không ';
                if (e === '2') return ' mũ 2 ';
                if (e === '3') return ' mũ 3 ';
                if (e === '-1') return ' mũ âm một ';
                if (e.charAt(0) === '-') return ' mũ âm ' + e.substring(1) + ' ';
                if (/^[A-Za-z]$/.test(e)) return ' mũ ' + spellGeoTokenVi(e) + ' ';
                return ' mũ ' + e + ' ';
            }

            t = t.replace(new RegExp('([0-9a-zA-Z)\\]])\\s*(' + SUP_CLASS + '+)', 'g'), function(m, base, ex) {
                var plain = ex.split('').map(function(c) { return SUP[c] || c; }).join('');
                return base + powerName(plain);
            });

            t = t.replace(/([0-9a-zA-Z\)\]])\s*\^\s*\{([^{}]+)\}/g, function(m, base, ex) {
                return base + powerName(ex);
            });
            t = t.replace(/([0-9a-zA-Z\)\]])\s*\^\s*\(([^()]+)\)/g, function(m, base, ex) {
                return base + ' mũ mở ngoặc ' + ex + ' đóng ngoặc ';
            });
            t = t.replace(/([0-9a-zA-Z\)\]])\s*\^\s*(-?[0-9a-zA-Z]+)/g, function(m, base, ex) {
                return base + powerName(ex);
            });

            // 7. Chỉ số dưới (Subscripts): x_1, x_2, u_n, x_{n+1}, A₁, O₁
            var SUB = {
                '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9',
                '₊':'+','₋':'-','₌':'=','₍':'(','₎':')','ₙ':'n','ₓ':'x','ₐ':'a','ₖ':'k','ₘ':'m','ᵢ':'i'
            };
            var SUB_CLASS = '[' + Object.keys(SUB).join('') + ']';

            t = t.replace(new RegExp('([0-9a-zA-Z])\\s*(' + SUB_CLASS + '+)', 'g'), function(m, base, idx) {
                var plain = idx.split('').map(function(c) { return SUB[c] || c; }).join('');
                var bSpoken = /^[A-Za-z]$/.test(base) ? spellGeoTokenVi(base) : base;
                var iSpoken = /^[A-Za-z]$/.test(plain) ? spellGeoTokenVi(plain) : plain;
                return ' ' + bSpoken + ' ' + iSpoken + ' ';
            });
            t = t.replace(/([0-9a-zA-Z])\s*_\s*\{([^{}]+)\}/g, function(m, base, idx) {
                var bSpoken = /^[A-Za-z]$/.test(base) ? spellGeoTokenVi(base) : base;
                return ' ' + bSpoken + ' ' + idx + ' ';
            });
            t = t.replace(/([0-9a-zA-Z])\s*_\s*([0-9a-zA-Z]+)/g, function(m, base, idx) {
                var bSpoken = /^[A-Za-z]$/.test(base) ? spellGeoTokenVi(base) : base;
                var iSpoken = /^[A-Za-z]$/.test(idx) ? spellGeoTokenVi(idx) : idx;
                return ' ' + bSpoken + ' ' + iSpoken + ' ';
            });

            // 8. Tập hợp số & Logic
            var SETS = {
                'ℕ*': 'tập hợp nờ sao',
                '\\mathbb{N}^*': 'tập hợp nờ sao',
                '\\mathbb{N}*': 'tập hợp nờ sao',
                'ℤ*': 'tập hợp dét sao',
                '\\mathbb{Z}^*': 'tập hợp dét sao',
                'ℚ*': 'tập hợp quy sao',
                '\\mathbb{Q}^*': 'tập hợp quy sao',
                'ℝ*': 'tập hợp rờ sao',
                '\\mathbb{R}^*': 'tập hợp rờ sao',
                'ℝ': 'tập số thực rờ',
                'ℕ': 'tập số tự nhiên nờ',
                'ℤ': 'tập số nguyên dét',
                'ℚ': 'tập số hữu tỉ quy',
                'ℂ': 'tập số phức xê',
                '\\mathbb{R}': 'tập số thực rờ',
                '\\mathbb{N}': 'tập số tự nhiên nờ',
                '\\mathbb{Z}': 'tập số nguyên dét',
                '\\mathbb{Q}': 'tập số hữu tỉ quy',

            };
            for (var sk in SETS) {
                t = t.split(sk).join(' ' + SETS[sk] + ' ');

            t = t.replace(/\\in\b|∈/g, ' thuộc ');
            t = t.replace(/\\notin\b|∉/g, ' không thuộc ');
            t = t.replace(/\\subseteq\b|⊆/g, ' là tập con hoặc bằng ');
            t = t.replace(/\\subset\b|⊂/g, ' là tập con của ');
            t = t.replace(/\\cup\b|∪/g, ' hợp ');
            t = t.replace(/\\cap\b|∩/g, ' giao ');
            t = t.replace(/\\emptyset\b|\\varnothing\b|∅/g, ' tập rỗng ');
            t = t.replace(/\\Rightarrow\b|⇒/g, ' suy ra ');
            t = t.replace(/\\Leftrightarrow\b|⇔/g, ' tương đương ');
            t = t.replace(/\\forall\b|∀/g, ' với mọi ');
            t = t.replace(/\\exists\b|∃/g, ' tồn tại ');

            // 9. Ký hiệu Hy Lạp & Vô cực
            var GREEK = {
                '\\alpha': 'an pha', 'α': 'an pha',
                '\\beta': 'bê ta', 'β': 'bê ta',
                '\\gamma': 'gam ma', 'γ': 'gam ma',
                '\\delta': 'đen ta', 'δ': 'đen ta',
                '\\theta': 'thê ta', 'θ': 'thê ta',
                '\\lambda': 'lam đa', 'λ': 'lam đa',
                '\\pi': 'pi', 'π': 'pi',
                '\\sigma': 'xích ma', 'σ': 'xích ma',
                '\\varphi': 'phi', 'φ': 'phi',
                '\\omega': 'ô mê ga', 'ω': 'ô mê ga',
                '\\Omega': 'ô mê ga', 'Ω': 'ô mê ga',
                '\\infty': 'vô cực', '∞': 'vô cực'
            };
            for (var gk in GREEK) {
                t = t.split(gk).join(' ' + GREEK[gk] + ' ');
            }

            // 10. Phân thức đại số có ngoặc (x - 3)/(x + 2) & Phân số dạng x/y thường
            t = t.replace(/\(([^()]+)\)\s*\/\s*\(([^()]+)\)/g, function(_, a, b) {
                return ' ' + a.trim() + ' trên ' + b.trim() + ' ';
            });
            t = t.replace(/\(([^()]+)\)\s*\/\s*([0-9A-Za-z⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function(_, a, b) {
                return ' ' + a.trim() + ' trên ' + b.trim() + ' ';
            });
            t = t.replace(/([0-9A-Za-z⁰¹²³⁴⁵⁶⁷⁸⁹]+)\s*\/\s*\(([^()]+)\)/g, function(_, a, b) {
                return ' ' + a.trim() + ' trên ' + b.trim() + ' ';
            });
            t = t.replace(/(\b[0-9]+)\s*\/\s*([0-9]+\b)/g, function(m, a, b) {
                if (a === '1' && b === '2') return 'một phần hai';
                if (a === '1' && b === '4') return 'một phần tư';
                if (a === '3' && b === '4') return 'ba phần tư';
                return a + ' phần ' + b;
            });
            t = t.replace(/([0-9A-Za-z])\s*\/\s*([0-9A-Za-z]+)/g, '$1 phần $2');

            // 10b. Tọa độ điểm/vectơ trong ngoặc (2; 3) hoặc (1; -2; 3) -> đổi dấu chấm phẩy thành dấu phẩy ngắt nhịp để không đọc dính "2 3" thành "23"
            t = t.replace(/\(([^()]+;[^()]+)\)/g, function(m, inner) {
                return '(' + inner.replace(/\s*;\s*/g, ', ') + ')';
            });

            // 10c. Chữ cái IN HOA đơn lẻ đứng độc lập (Điểm O, A, B, C, D, M, N, H, I, K, Bán kính R, Diện tích S, Thể tích V, Chu vi C...)
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([A-Z])(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, ch) {
                return (pre || '') + ' ' + (VI_MATH_CHAR[ch] || ch) + ' ';
            });

            // 10d. Biến đại số & hình học chữ thường (x, y, z, ax, bx, 2x, 3y, 4ac, 2ab, r = 5, h = 4, b mũ 2...)
            t = t.replace(/(\d+)\s+[xX]\s+(?=\d+)/g, '$1 nhân ');
            t = t.replace(/(\d)\s*([a-z])([a-z])(?![A-Za-zÀ-ỹ])/g, function(m, d, c1, c2) {
                if (/^[abcxyz]$/.test(c1) && /^[abcxyz]$/.test(c2)) {
                    return d + ' ' + spellGeoTokenVi(c1) + ' ' + spellGeoTokenVi(c2) + ' ';
                }
                return m;
            });
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([abc])([xyz])(?![A-Za-zÀ-ỹ0-9])/g, function(m, pre, c1, c2) {
                return (pre || '') + ' ' + spellGeoTokenVi(c1) + ' ' + spellGeoTokenVi(c2) + ' ';
            });
            t = t.replace(/(\d)\s*x(?![A-Za-zÀ-ỹ])/g, '$1 ích ');
            t = t.replace(/(\d)\s*y(?![A-Za-zÀ-ỹ])/g, '$1 y ');
            t = t.replace(/(\d)\s*z(?![A-Za-zÀ-ỹ])/g, '$1 dét ');
            t = t.replace(/(\d)\s*([abcdhklmnpqrt])(?=$|[\s.,;:?!)\]+=\-*/])/g, function(m, d, ch) {
                return d + ' ' + spellGeoTokenVi(ch) + ' ';
            });
            // Chữ thường đơn lẻ đứng trước "mũ" hoặc toán tử (=, <, >, ≤, ≥, ≠, ≈, +, -) hoặc sau từ khóa toán học
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([abcdhklmnpqrtuvxyz])\s+(?=mũ\b|vuông\s+góc|song\s+song|trùng\s+với|thuộc\b|không\s+thuộc)/g, function(m, pre, ch) {
                return (pre || '') + ' ' + spellGeoTokenVi(ch) + ' ';
            });
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])([abcdhklmnpqrtuvxyz])\s*(?=[=<>≤≥≠≈±])/g, function(m, pre, ch) {
                return (pre || '') + ' ' + spellGeoTokenVi(ch) + ' ';
            });
            t = t.replace(/([=<>≤≥≠≈±+\-*/])\s*([abcdhklmnpqrtuvxyz])(?![A-Za-zÀ-ỹ0-9])/g, function(m, op, ch) {
                return op + ' ' + spellGeoTokenVi(ch) + ' ';
            });
            // Biến x, z đứng độc lập ở bất kỳ vị trí nào trong câu tiếng Việt (vì tiếng Việt không có từ đơn 1 chữ "x" hoặc "z")
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])x(?![A-Za-zÀ-ỹ0-9])/g, '$1 ích ');
            t = t.replace(/(^|[^A-Za-zÀ-ỹ0-9])z(?![A-Za-zÀ-ỹ0-9])/g, '$1 dét ');

            // 11. Phép chia hai chấm (chỉ giữa 2 số, tránh nhầm văn bản)
            t = t.replace(/(\d+)\s*:\s*(\d+)/g, '$1 chia $2');
            t = t.replace(/\\div\b|÷/g, ' chia ');

    let ttsToken = 0; let currentAudio = null;
    function stopSpeech() {
        ttsToken++;
        if (currentAudio) { try { currentAudio.pause(); } catch (e) { } currentAudio = null; }
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
    function splitChunks(text) {
        if (window.splitEduGameSpeechChunks) return window.splitEduGameSpeechChunks(text, 165);
        const chunks = []; let cur = '';
        for (const ch of text) {
            cur += ch;
            if ('.,;!?'.includes(ch) && cur.length > 60) { chunks.push(cur); cur = ''; }
            else if (cur.length >= 180) {
                const k = cur.lastIndexOf(' ');
                if (k > 0) { chunks.push(cur.slice(0, k)); cur = cur.slice(k + 1); } else { chunks.push(cur); cur = ''; }
            }
        }
        if (cur.trim()) chunks.push(cur);
        return chunks;
    }
    function speak(text, cb) {
        stopSpeech();
        const token = ttsToken;
        let finished = false;
        const done = () => { if (finished || token !== ttsToken) return; finished = true; Music.duck(false); if (cb) cb(); };
        const spoken = mathToSpeech(text);
        if (!spoken) { done(); return; }
        Music.duck(true);
        setTimeout(done, Math.max(4000, spoken.length * 120 + 3000)); // an toàn: không bao giờ treo game nếu mất mạng
        if (VOICE === 'google_cloud' || window.__fakeTTS || !window.speechSynthesis || window.__voiceMissing(VOICE)) {
            const chunks = splitChunks(spoken); let i = 0;
            const next = () => {
                if (token !== ttsToken) return;
                if (i >= chunks.length) { done(); return; }
                let moved = false;
                const go = () => { if (moved) return; moved = true; next(); };
                const a = ttsEl('https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=' + encodeURIComponent(chunks[i++]));
                currentAudio = a; a.onended = go; a.onerror = go;
                a.play().catch(go);
            };
            next();
            return;
        }
        const u = new SpeechSynthesisUtterance(spoken);
        u.lang = 'vi-VN';
        const v = (window.speechSynthesis.getVoices() || []).find(x => x.name === VOICE);
        if (v) u.voice = v;
        u.onend = done; u.onerror = done;
        window.speechSynthesis.speak(u);
    }

        MILESTONES.forEach(m => { if (m < state.cur) p = Math.max(p, PRIZES[m]); });
        return p;
    }

    function endGame(type) {
        state.ended = true; state.locked = true;
        pauseTimer(); setLifelines(); renderLadder();
        Music.stopBed(0.8);
        const prize = type === 'win' ? PRIZES[N - 1] : type === 'walk' ? (state.cur > 0 ? PRIZES[state.cur - 1] : 0) : safePrize();
        const titles = { win: '🏆 XIN CHÚC MỪNG!', lose: '😢 RẤT TIẾC!', timeout: '⏰ HẾT GIỜ!', walk: '🏳️ DỪNG CUỘC CHƠI' };
        const sub = type === 'win'
            ? 'Bạn đã chinh phục toàn bộ ' + N + ' câu hỏi và trở thành TRIỆU PHÚ!'
            : 'Bạn đã trả lời đúng ' + state.correct + '/' + N + ' câu hỏi.';
        openModal('end',
            '<div class="m-icon big">' + (type === 'win' ? '👑' : '🎓') + '</div><h2>' + titles[type] + '</h2><p>' + sub + '</p>'
            + '<div class="prize-label">Tiền thưởng của bạn</div><div class="prize">' + money(prize) + '</div>',
            [
                { label: '📊 Ghi danh Xếp hạng', kind: 'ghost', onClick: () => { const rk = document.getElementById('edugame-rank-fab'); if (rk) rk.click(); const tb = document.getElementById('egr-tab-submit'); if (tb) tb.click(); const sc = document.getElementById('egr-manual-score'); if (sc) sc.value = state.correct * 10; const dt = document.getElementById('egr-manual-detail'); if (dt) dt.value = state.correct + '/' + N + ' câu (' + money(prize) + ')'; } },
                { label: '🔄 Chơi lại', kind: 'primary', onClick: () => location.reload() }
            ]);
        if (type === 'win') {
            Music.win(); celebrate(false);
            speak('Xin chúc mừng! Bạn đã trở thành triệu phú với giải thưởng ' + speechMoney(prize) + '!');
        } else {
            speak('Bạn đã trả lời đúng ' + state.correct + ' trên ' + N + ' câu hỏi, và ra về với số tiền thưởng ' + speechMoney(prize) + '. Cảm ơn bạn đã tham gia chương trình!');
        }

    /* ---------- 3 quyền trợ giúp ---------- */
    const canUse = k => state.started && !state.used[k] && !state.locked && !state.ended && !state.modal;

    function useFifty() {
        if (!canUse('fifty')) return;
        const q = questions[state.cur];
        if ((window.isTf4Question && window.isTf4Question(q)) || (window.isMultipleQuestion && window.isMultipleQuestion(q))) {
            state.readDone = true;
            state.used.fifty = true; setLifelines();
            Music.lifeline();
            if (window.prefillFiftyTf4) window.prefillFiftyTf4($('q-area'), q);
            speak((window.isMultipleQuestion && window.isMultipleQuestion(q))
                ? 'Máy tính đã loại bỏ các phương án sai giúp bạn.'
                : 'Máy tính đã điền sẵn đáp án Đúng hoặc Sai chính xác cho hai nhận định.', ensureTimer);
            return;
        }
        const wrongs = visibleOptions().filter(k => k !== q.answer);
        const removeCount = Math.min(2, wrongs.length - 1);
        if (removeCount <= 0) return;
        state.readDone = true;
        state.used.fifty = true; setLifelines();
        Music.lifeline();
        shuffle(wrongs).slice(0, removeCount).forEach(k => { state.hidden.add(k); answerEls()[k].classList.add('removed'); });
        speak('Máy tính đã loại bỏ ' + (removeCount === 2 ? 'hai' : 'một') + ' phương án sai.', ensureTimer);
    }

    function usePhone() {
        if (!canUse('phone')) return;
        state.readDone = true;
        state.used.phone = true; setLifelines();
        const q = questions[state.cur];
        if ((window.isTf4Question && window.isTf4Question(q)) || (window.isMultipleQuestion && window.isMultipleQuestion(q))) {
            const isMulti = !!(window.isMultipleQuestion && window.isMultipleQuestion(q));
            const sumTxt = isMulti ? window.getMultipleSummaryText(q) : window.getTf4SummaryText(q);
            const spTxt = window.getTf4SpeechText(q);
            openModal('phone',
                '<div class="m-icon ring">📞</div><h2>Gọi điện cho người thân</h2><p id="phone-text" class="typing">Đang kết nối cuộc gọi</p>',
                [{ label: 'Cảm ơn bạn!', kind: 'primary', onClick: () => { stopSpeech(); closeModal(); } }]);
            Music.ring();
            setTimeout(() => {
                if (state.modal !== 'phone') return;
                const el = $('phone-text');
                el.classList.remove('typing');
                el.innerHTML = '👩‍🏫 <i>"A lô! Theo mình nghĩ, đáp án đúng của câu hỏi này là:<br><b class="hl">' + sumTxt + '</b>.<br>Mình chắc chắn khoảng <b>90%</b>."</i>';
                document.querySelector('#modal .m-icon').classList.remove('ring');
                speak('A lô! Theo mình nghĩ, đáp án đúng là ' + spTxt + '.');
            }, 2200);
            return;
        }
        const vis = visibleOptions();
        const others = vis.filter(k => k !== q.answer);
        const right = Math.random() < (vis.length <= 2 ? 0.9 : 0.8);
        const pick = right || !others.length ? q.answer : others[rand(others.length)];
        const conf = pick === q.answer ? 70 + rand(26) : 40 + rand(21);
        openModal('phone',
            '<div class="m-icon ring">📞</div><h2>Gọi điện cho người thân</h2><p id="phone-text" class="typing">Đang kết nối cuộc gọi</p>',
            [{ label: 'Cảm ơn bạn!', kind: 'primary', onClick: () => { stopSpeech(); closeModal(); } }]);
        Music.ring();
        setTimeout(() => {
            if (state.modal !== 'phone') return;
            const el = $('phone-text');
            el.classList.remove('typing');
            el.innerHTML = '👩‍🏫 <i>"A lô! Theo mình nghĩ, đáp án đúng là <b class="hl">' + LETTERS[pick] + '</b>. Mình chắc chắn khoảng <b>' + conf + '%</b>."</i>';
            document.querySelector('#modal .m-icon').classList.remove('ring');
            speak('A lô! Theo mình nghĩ, đáp án đúng là ' + LETTERS[pick] + '. Mình chắc chắn khoảng ' + conf + ' phần trăm.');

    function useAudience() {
        if (!canUse('audience')) return;
        state.readDone = true;
        state.used.audience = true; setLifelines();
        Music.lifeline();
        const q = questions[state.cur];
        if ((window.isTf4Question && window.isTf4Question(q)) || (window.isMultipleQuestion && window.isMultipleQuestion(q))) {
            const isMulti = !!(window.isMultipleQuestion && window.isMultipleQuestion(q));
            if (isMulti) {
                const mExp = window.getMultipleExpected(q);
                const pct = [0, 1, 2, 3].map(k => mExp.indexOf(k) >= 0 ? (42 + rand(8)) : (3 + rand(6)));
                const cols = LETTERS.map((L, k) => '<div class="bar-col"><div class="bar-pct">' + pct[k] + '%</div><div class="bar" data-h="' + pct[k] + '"></div></div>').join('');
                const labels = LETTERS.map(L => '<div class="bar-lb">' + L + '</div>').join('');
                openModal('audience',
                    '<div class="m-icon">👥</div><h2>Ý kiến khán giả</h2><div class="poll">' + cols + '</div><div class="poll-labels">' + labels + '</div>',
                    [{ label: 'Cảm ơn khán giả!', kind: 'primary', onClick: () => { stopSpeech(); closeModal(); } }]);
                setTimeout(() => document.querySelectorAll('#modal .bar').forEach(b => { b.style.height = b.dataset.h + '%'; }), 80);
                speak('Đây là kết quả bình chọn của khán giả trong trường quay.');
                return;
            }
            const exp = window.getTf4Expected(q);
            const pct = exp.map(() => 82 + rand(15));
            const cols = LETTERS.map((L, k) => '<div class="bar-col"><div class="bar-pct">' + exp[k] + ' (' + pct[k] + '%)</div><div class="bar" data-h="' + pct[k] + '"></div></div>').join('');
            const labels = LETTERS.map((L, k) => '<div class="bar-lb">' + L + ':' + exp[k] + '</div>').join('');
            openModal('audience',
                '<div class="m-icon">👥</div><h2>Ý kiến khán giả (Đúng / Sai)</h2><div class="poll">' + cols + '</div><div class="poll-labels">' + labels + '</div>',
                [{ label: 'Cảm ơn khán giả!', kind: 'primary', onClick: () => { stopSpeech(); closeModal(); } }]);
            setTimeout(() => document.querySelectorAll('#modal .bar').forEach(b => { b.style.height = b.dataset.h + '%'; }), 80);
            speak('Đây là kết quả bình chọn Đúng Sai của khán giả trong trường quay.');
            return;
        }
        const vis = visibleOptions();
        const misled = vis.length > 2 && Math.random() < 0.12;
        const w = [0, 0, 0, 0];
        vis.forEach(k => { w[k] = 0.15 + Math.random(); });
        w[q.answer] = misled ? 0.9 + Math.random() * 0.3 : (vis.length <= 2 ? 2.6 : 2.2) * (0.8 + Math.random() * 0.6);
        if (misled) { const o = shuffle(vis.filter(k => k !== q.answer))[0]; w[o] = 1.5 + Math.random() * 0.5; }
        const sum = w.reduce((a, b) => a + b, 0);
        const pct = w.map(x => Math.round(100 * x / sum));
        const diff = 100 - pct.reduce((a, b) => a + b, 0);
        pct[pct.indexOf(Math.max(...pct))] += diff;

        const cols = LETTERS.map((L, k) => '<div class="bar-col' + (vis.includes(k) ? '' : ' dim') + '"><div class="bar-pct">' + pct[k] + '%</div><div class="bar" data-h="' + pct[k] + '"></div></div>').join('');
        const labels = LETTERS.map(L => '<div class="bar-lb">' + L + '</div>').join('');
        openModal('audience',
            '<div class="m-icon">👥</div><h2>Ý kiến khán giả</h2><div class="poll">' + cols + '</div><div class="poll-labels">' + labels + '</div>',
            [{ label: 'Cảm ơn khán giả!', kind: 'primary', onClick: () => { stopSpeech(); closeModal(); } }]);
        setTimeout(() => document.querySelectorAll('#modal .bar').forEach(b => { b.style.height = b.dataset.h + '%'; }), 80);
        speak('Đây là kết quả bình chọn của khán giả trong trường quay.');
    }

        muteBtn.addEventListener('click', () => { Music.setMuted(!Music.isMuted()); paintMute(); });

            if (!state.started) { if (e.key === 'Enter' && !e.repeat) { e.preventDefault(); startGame(); } return; }

                if (e.key === 'Enter') { const p = document.querySelector('#modal .mbtn.primary'); if (p) { e.preventDefault(); p.click(); } }

            if ((window.isTf4Question && window.isTf4Question(curQ)) || (window.isMultipleQuestion && window.isMultipleQuestion(curQ))) {
                if (e.key === 'Enter') {
                    const subBtn = document.querySelector('.eg-tf4-submit-btn');
                    if (subBtn) { e.preventDefault(); subBtn.click(); }
                }
                return;
            }
            const map = { A: 0, B: 1, C: 2, D: 3, '1': 0, '2': 1, '3': 2, '4': 3 };

            if (k === 'M') { muteBtn.click(); return; }
            if (k in map) choose(map[k]);
        });

        window.__millionaire = { Music, state, questions, PRIZES, MILESTONES, choose, lockIn, useFifty, usePhone, useAudience, askWalkAway, startGame };
    }

<script>
(function(){
  if (window.__dtAutoFullscreenInstalled) return;
  window.__dtAutoFullscreenInstalled = true;

  var manualExit = false;
  var autoTriggered = false;

  function isFullscreenNow() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }

  function enterFullscreenSafe() {
    if (isFullscreenNow()) return Promise.resolve(true);
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!req) return Promise.resolve(false);
    try {
      var res = req.call(el);
      if (res && typeof res.then === "function") {
        return res.then(function(){ return true; }).catch(function(){ return false; });
      }
      return Promise.resolve(true);
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function exitFullscreenSafe() {
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (!ex) return;
    try { ex.call(document); } catch (e) {}
  }

  window.dtToggleFullscreen = function(ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (isFullscreenNow()) {
      manualExit = true;
      exitFullscreenSafe();
    } else {
      manualExit = false;
      enterFullscreenSafe();
    }
  };

  function updateAllFullscreenButtons() {
    var active = isFullscreenNow();
    document.body.classList.toggle("dt-is-fullscreen", active);
    document.body.classList.toggle("eg-fullscreen-zoom", active);
    var btns = document.querySelectorAll("#eg-fs-toggle-btn, #dt-fs-floating-btn, #dt-elearning-fs-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].innerHTML = active ? "🗗 Thoát Full màn hình" : "⛶ Mở Full màn hình";
      btns[i].setAttribute("aria-pressed", active ? "true" : "false");
    }
    if (typeof window.scaleSlide === "function") {
      setTimeout(window.scaleSlide, 60);
      setTimeout(window.scaleSlide, 220);
    }
  }

  document.addEventListener("fullscreenchange", updateAllFullscreenButtons);
  document.addEventListener("webkitfullscreenchange", updateAllFullscreenButtons);
  window.addEventListener("resize", function(){
    if (typeof window.scaleSlide === "function") {
      window.scaleSlide();
    }
  });

  // Ensure portal back button exists on all games/lessons
  function ensureTopLeftControls() {
    // If portal back link is missing, add it
    var backBtn = document.getElementById("dt-portal-back-btn");
    if (!backBtn && !document.querySelector(".topbar .back-btn")) {
      backBtn = document.createElement("a");
      backBtn.id = "dt-portal-back-btn";
      backBtn.href = "../../index.html";
      backBtn.innerHTML = "🏠 Cổng bài giảng";
      document.body.appendChild(backBtn);
    }

    // If neither #eg-fs-toggle-btn nor .topbar exists, create #dt-fs-floating-btn
    var hasEgBtn = !!document.getElementById("eg-fs-toggle-btn");
    var topbar = document.querySelector(".topbar");
    if (topbar && !document.getElementById("dt-elearning-fs-btn")) {
      var fsBtn = document.createElement("button");
      fsBtn.id = "dt-elearning-fs-btn";
      fsBtn.type = "button";
      fsBtn.className = "dt-topbar-fs-btn";
      fsBtn.innerHTML = "⛶ Mở Full màn hình";
      fsBtn.onclick = window.dtToggleFullscreen;
      var slideCounter = topbar.querySelector(".slide-counter");
      if (slideCounter) {
        topbar.insertBefore(fsBtn, slideCounter);
      } else {
        topbar.appendChild(fsBtn);
      }
    } else if (!hasEgBtn && !topbar && !document.getElementById("dt-fs-floating-btn")) {
      var floatBtn = document.createElement("button");
      floatBtn.id = "dt-fs-floating-btn";
      floatBtn.type = "button";
      floatBtn.innerHTML = "⛶ Mở Full màn hình";
      floatBtn.onclick = window.dtToggleFullscreen;
      document.body.appendChild(floatBtn);
    }
    updateAllFullscreenButtons();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureTopLeftControls);
  } else {
    ensureTopLeftControls();
  }
  setTimeout(ensureTopLeftControls, 300);

  // Auto-trigger Fullscreen on student's first meaningful click (e.g. Start Game, Choice, Next Slide, Play)
  document.addEventListener("click", function(e) {
    if (manualExit || isFullscreenNow()) return;
    var t = e.target;
    if (!t || !t.closest) return;
    // Ignore clicks on Back to Portal, Fullscreen toggle itself, or Class Picker close
    if (t.closest("#dt-portal-back-btn, .back-btn, #eg-fs-toggle-btn, #dt-fs-floating-btn, #dt-elearning-fs-btn, #eg-class-picker-btn, #eg-picker-overlay")) {
      return;
    }
    // Trigger on start buttons, answer buttons, wheel spin, slide navigation, or first click inside game/lesson container
    if (!autoTriggered) {
      autoTriggered = true;
      enterFullscreenSafe().then(function(){
        updateAllFullscreenButtons();
      });
    } else if (t.closest(".btn-start-game, #start-btn, .spin-btn, .rescue-opt-btn, .btn-choice, .ans, .btn-play")) {
      enterFullscreenSafe().then(function(){
        updateAllFullscreenButtons();
      });
    }
  }, true);
})();
</script>

<!-- DT_FULLSCREEN_READABILITY_END -->
