function installConfettiFallback() {
    if (typeof window.confetti === "function") return;
    var cv = null, cx = null, bits = [], running = false;

        window.addEventListener("resize", function () { cv.width = window.innerWidth; cv.height = window.innerHeight; });

        if (Array.isArray(q.tfValues) && q.tfValues.length === 4) return true;
        if (/Điền\s+Đ\s*\(?Đúng\)?\s*hoặc\s+S\s*\(?Sai\)?/i.test(String(q.q || ""))) return true;

    window.getTf4Expected = function(q) {
        if (!q) return ["Đ", "S", "Đ", "S"];
        if (Array.isArray(q.tfValues) && q.tfValues.length === 4) {
            return q.tfValues.map(function(v) {
                var s = String(v || "").trim().toUpperCase();
                return (s === "S" || s === "SAI" || s === "FALSE" || s === "F" || s === "0") ? "S" : "Đ";
            });
        }
        var ansArr = Array.isArray(q.answers) ? q.answers.map(Number) : [Number(q.answer) || 0];
        return [0, 1, 2, 3].map(function(i) {
            return ansArr.indexOf(i) >= 0 ? "Đ" : "S";
        });
    };

    window.getTf4SummaryText = function(q) {
        var exp = window.getTf4Expected(q);
        var L = ["A", "B", "C", "D"];

    window.getTf4SpeechText = function(q) {

    function normalizeBlankAns(s) {
        return String(s || "").trim().toLowerCase()
            .replace(/^[a-z]\s*=\s*/i, "")
            .replace(/\s+/g, " ")
            .replace(/,/g, ".");

    window.checkBlankUserAnswer = function(q, userStr) {
        var u = normalizeBlankAns(userStr);
        if (!u) return false;
        var candidates = [];
        if (Array.isArray(q.blanks)) candidates = candidates.concat(q.blanks);
        if (q.rawBlankAnswer) candidates.push(q.rawBlankAnswer);
        if (Array.isArray(q.options) && q.options[q.answer] !== undefined) candidates.push(q.options[q.answer]);
        if (typeof q.answer === "string") candidates.push(q.answer);
        for (var i = 0; i < candidates.length; i++) {
            var c = normalizeBlankAns(candidates[i]);

                onEnd();
            });
            window.addEventListener("touchcancel", function() {
                onEnd();
            });

            window.addEventListener("resize", function() {
                var rect = btnEl.getBoundingClientRect();
                clampAndApply(rect.left, rect.top);
            });

            setTimeout(restorePos, 0);

            btnEl.onclick = function(e) {
                if (dragState.moved || (Date.now() - dragState.lastDragEnd < 280)) {
                    if (e && e.preventDefault) e.preventDefault();
                    return;
                }
                if (typeof onTap === "function") onTap();
            };
        }

        function isCurrentlyFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || document.body.classList.contains("eg-pseudo-fullscreen"));
        }

        function syncFullscreenUI() {
            var active = isCurrentlyFullscreen();
            if (document.body) {
                document.body.classList.toggle("eg-fullscreen-zoom", active);
            }
            if (fsFab) {
                fsFab.classList.toggle("epm-fs-active", active);
                fsFab.innerHTML = active
                    ? "<span style=\"opacity:0.75;font-size:13px;margin-right:1px\">⠿</span><span>🗗</span><span>Thoát Full</span>"
                    : "<span style=\"opacity:0.75;font-size:13px;margin-right:1px\">⠿</span><span>⛶</span><span>Full màn hình</span>";
            }
            var inlineBtns = document.querySelectorAll(".eg-inline-fs-btn");
            for (var i = 0; i < inlineBtns.length; i++) {
                inlineBtns[i].innerHTML = active ? "🗗 Thoát Full" : "⛶ Full màn hình";
            }
        }

        window.toggleEduGameFullscreen = function() {
            var de = document.documentElement;
            if (!isCurrentlyFullscreen()) {
                var req = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen || de.msRequestFullscreen;
                if (req) {
                    try {
                        var pr = req.call(de);
                        if (pr && typeof pr.then === "function") {
                            pr.then(syncFullscreenUI).catch(function() {
                                document.body.classList.add("eg-pseudo-fullscreen");
                                syncFullscreenUI();
                            });
                        } else {
                            setTimeout(syncFullscreenUI, 100);
                        }
                    } catch (e) {
                        document.body.classList.add("eg-pseudo-fullscreen");
                        syncFullscreenUI();
                    }
                } else {
                    document.body.classList.add("eg-pseudo-fullscreen");
                    syncFullscreenUI();
                }
            } else {
                document.body.classList.remove("eg-pseudo-fullscreen");
                var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (ex && (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement)) {
                    try {
                        var pr2 = ex.call(document);
                        if (pr2 && typeof pr2.then === "function") pr2.then(syncFullscreenUI).catch(syncFullscreenUI);
                        else setTimeout(syncFullscreenUI, 100);
                    } catch (e) {
                        syncFullscreenUI();
                    }
                } else {
                    syncFullscreenUI();
                }
            }
        };

        document.addEventListener("fullscreenchange", syncFullscreenUI);
        document.addEventListener("webkitfullscreenchange", syncFullscreenUI);
        document.addEventListener("mozfullscreenchange", syncFullscreenUI);
        document.addEventListener("MSFullscreenChange", syncFullscreenUI);

        bindDraggableFab(fab, "EDUGAME_PICKER_FAB_POS_V1", 14, 68, 60, function() {
            refreshMeta();
            modal.style.display = "flex";
        });

        bindDraggableFab(fsFab, "EDUGAME_FS_FAB_POS_V1", 14, 114, 100, function() {
            window.toggleEduGameFullscreen();
        });
        document.getElementById("epm-close").onclick = function() {
            modal.style.display = "none";
        };
        modal.onclick = function(e) {
            if (e.target === modal && !state.spinning) modal.style.display = "none";
        };
        document.getElementById("epm-spin-btn").onclick = spinNow;
        document.getElementById("epm-reset-btn").onclick = function() {
            state.called = [];
            refreshMeta();
            var disp = document.getElementById("epm-display");
            var sub = document.getElementById("epm-subtext");
            if (disp) { disp.textContent = "🎁 Đã làm mới lượt!"; disp.style.color = "#fef08a"; }
            if (sub) sub.textContent = "Tất cả học sinh trong lớp đã sẵn sàng cho lượt quay mới.";
        };
        document.getElementById("epm-edit-btn").onclick = function() {
            var ep = document.getElementById("epm-editor-panel");
            var ta = document.getElementById("epm-textarea");
            if (!ep) return;
            var show = ep.style.display === "none";
            ep.style.display = show ? "block" : "none";
            if (show && ta) ta.value = state.students.join("\n");
        };
        var quickBtns = modal.querySelectorAll("[data-quick-num]");
        for (var q = 0; q < quickBtns.length; q++) {
            quickBtns[q].onclick = function() {
                var n = parseInt(this.getAttribute("data-quick-num"), 10) || 40;
                var arr = [];
                for (var k = 1; k <= n; k++) arr.push("Số thứ tự " + (k < 10 ? "0" + k : k));
                var ta = document.getElementById("epm-textarea");
                if (ta) ta.value = arr.join("\n");
            };
        }
        document.getElementById("epm-save-roster").onclick = function() {
            var ta = document.getElementById("epm-textarea");
            var rawText = ta ? ta.value : "";
            var parts = rawText.split(/[\r\n,;]+/);
            var clean = [];
            for (var i = 0; i < parts.length; i++) {
                var s = parts[i].trim();
                if (s) clean.push(s);
            }
            if (!clean.length) return;
            saveRoster("Danh sách lớp (" + clean.length + " HS)", clean);
            document.getElementById("epm-editor-panel").style.display = "none";
            refreshMeta();
            var disp = document.getElementById("epm-display");
            if (disp) disp.textContent = "✅ Đã lưu " + clean.length + " HS!";
        };

        window.addEventListener("keydown", function(e) {
            if (e.key === "F2") {
                e.preventDefault();
                if (modal.style.display !== "flex") {
                    refreshMeta();
                    modal.style.display = "flex";
                } else {
                    spinNow();
                }
            }
        });

        refreshMeta();
    }

    if (document.body) {
        mountUI();
    } else {
        window.addEventListener("DOMContentLoaded", mountUI);
    }
}
installSafety();
installConfettiFallback();
installTtsUnlock();
installLandscape();
installQuestionMedia();
installUniversalTf4Engine();
installClassroomPicker();</script>
