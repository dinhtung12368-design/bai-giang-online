<script>(function installUnifiedMathSpeechEngine() {
        if (typeof window === 'undefined') return;

        function preprocessGeometryAndMathForSpeech(rawInput) {
            if (rawInput === null || rawInput === undefined) return '';
            var s = String(rawInput);

            // 1. Bảo toàn các thẻ công thức HTML (<span class="math-hat">, <span class="math-frac">, <sup>) trước khi loại bỏ HTML tags
            s = s
                .replace(/<span[^>]*class="math-hat"[^>]*>(?:<span[^>]*><\/span>)?([^<]+)<\/span>/gi, ' ∠$1 ')
                .replace(/<span[^>]*class="math-frac"[^>]*>\s*<span[^>]*class="math-num"[^>]*>([^<]+)<\/span>\s*<span[^>]*class="math-slash"[^>]*>\/<\/span>\s*<span[^>]*class="math-den"[^>]*>([^<]+)<\/span>\s*<\/span>/gi, ' ($1)/($2) ')
                .replace(/<sup[^>]*>2<\/sup>/gi, '²')
                .replace(/<sup[^>]*>3<\/sup>/gi, '³')
                .replace(/<sup[^>]*>([^<]+)<\/sup>/gi, '^($1)')
                .replace(/<sub[^>]*>([^<]+)<\/sub>/gi, '_($1)')
                .replace(/<br\s*\/?>/gi, '. ')
                .replace(/<[^>]+>/g, ' ');

            // 2. Loại bỏ các biểu tượng trang trí để giọng đọc không đọc tên icon
            s = s.replace(/[📌🎯💡🪜✅🔎📐🎓📋🖼️•]/g, ' ').replace(/\s*\|\s*/g, '. ');

            // 3. Mở rộng các ký hiệu viết tắt Hình học & Toán học chuẩn Sách Giáo Khoa Việt Nam
            s = s
                .replace(/(^|[\s.;:])GT\s*:/g, '$1Giả thiết: ')
                .replace(/(^|[\s.;:])KL\s*:/g, '$1Kết luận: ')
                .replace(/\(\s*gt\s*\)/gi, ', theo giả thiết, ')
                .replace(/\(\s*cmt\s*\)/gi, ', chứng minh trên, ')
                .replace(/\(\s*đpcm\s*\)/gi, ', điều phải chứng minh')
                .replace(/\(\s*g\s*[.\-–]\s*g\s*\)/gi, ' theo trường hợp góc - góc ')
                .replace(/\(\s*c\s*[.\-–]\s*g\s*[.\-–]\s*c\s*\)/gi, ' theo trường hợp cạnh - góc - cạnh ')
                .replace(/\(\s*c\s*[.\-–]\s*c\s*[.\-–]\s*c\s*\)/gi, ' theo trường hợp cạnh - cạnh - cạnh ')
                .replace(/\(\s*ch\s*[.\-–]\s*cgv\s*\)/gi, ' theo trường hợp cạnh huyền - cạnh góc vuông ')
                .replace(/\(\s*ch\s*[.\-–]\s*gn\s*\)/gi, ' theo trường hợp cạnh huyền - góc nhọn ')
                .replace(/\(\s*cgv\s*[.\-–]\s*gn\s*\)/gi, ' theo trường hợp cạnh góc vuông - góc nhọn kề ')
                .replace(/\bPythagore\b|\bPy-ta-go\b/gi, 'Pi ta go')
                .replace(/\bThalès\b|\bThales\b|\bTa-lết\b/gi, 'Ta lết')
                .replace(/\bS_([A-Z]'?[A-Z]'?[A-Z]'?)\b/g, 'diện tích tam giác $1');

            // 4. Chuyển các chú thích Hình học trong ngoặc đơn và đánh số (1), (2) sang lời đọc tự nhiên (không đọc "mở ngoặc 1 đóng ngoặc")
            s = s
                .replace(/\b(Từ|theo)\s*\(\s*(\d+)\s*\)\s*(?:,|và)\s*\(\s*(\d+)\s*\)/gi, '$1 $2 và $3')
                .replace(/\b(Từ|theo)\s*\(\s*(\d+)\s*\)/gi, '$1 $2')
                .replace(/\(\s*theo\s*\(\s*(\d+)\s*\)\s*\)/gi, ' theo $1 ')
                .replace(/\(\s*cùng\s+phụ\s+(?:với\s+)?([^()]+)\)/gi, ', vì cùng phụ với $1, ')
                .replace(/\(\s*cùng\s+bù\s+(?:với\s+)?([^()]+)\)/gi, ', vì cùng bù với $1, ')
                .replace(/\(\s*(?:2|hai)\s+góc\s+(đồng\s+vị|so\s+le\s+trong|đối\s+đỉnh|kề\s+bù|phụ\s+nhau)\s*\)/gi, ', hai góc $1, ')
                .replace(/\(\s*(đồng\s+vị|so\s+le\s+trong|đối\s+đỉnh|kề\s+bù)\s*\)/gi, ', hai góc $1, ')
                .replace(/\(\s*(?:t\/c\s+)?trung\s+tuyến\s+(?:ứng\s+với\s+)?cạnh\s+huyền\s*\)/gi, ', tính chất đường trung tuyến ứng với cạnh huyền, ')
                .replace(/\(\s*(hệ\s+quả\s+Ta\s+lết|định\s+lí\s+Ta\s+lết|Ta\s+lết)\s*\)/gi, ', theo $1, ')
                .replace(/\(\s*(Pi\s+ta\s+go(?:\s+đảo)?|định\s+lí\s+Pi\s+ta\s+go(?:\s+đảo)?)\s*\)/gi, ', theo định lí $1, ')
                .replace(/\(\s*([∠∡]|\\widehat)\s*([A-Z']{1,6})\s*=\s*(\d+\s*°)\s*\)/g, ', có ∠$2 = $3, ')
                .replace(/\(\s*([A-Z]'?\s*∈\s*[A-Z]'?[A-Z]'?(?:\s*,\s*[^()]+)?)\s*\)/g, ', với $1, ')
                .replace(/\s*\(\s*\d+\s*\)(?=\s*(?:[,.;]|⇒|$))/g, '');

            // 5. Đồng nhất cách đọc hệ số nhân trước góc (VD: "2∠HBM" -> "2 lần ∠HBM") và tỉ số/phân số đoạn thẳng ("AB/2" -> "AB trên 2", "A'B'/AB" -> "A'B' trên AB") TRƯỚC khi tách tên đoạn
            s = s
                .replace(/(\d+)\s*(?=[∠∡]|\\widehat\b|\\hat\b)/g, '$1 lần ')
                .replace(/[∡]/g, '∠')
                .replace(/(^|[\s(:=+\-−–,;\[]|⇒\s*)((?:[A-Z]'?){1,3})\s*\/\s*(\d+)(?=$|[\s).,;:?!=\]+−–\-])/g, '$1$2 trên $3')
                .replace(/(^|[\s(:=+\-−–,;\[]|⇒\s*)((?:[A-Z]'?){1,3})\s*\/\s*((?:[A-Z]'?){1,3})(?=$|[\s).,;:?!=\]+−–\-])/g, function(m, pre, a, b) {
                    if (/^(?:km|cm|mm|dm|ml|kg|hs)$/i.test(a) || /^(?:km|cm|mm|dm|ml|kg|hs)$/i.test(b)) return m;
                    return pre + a + ' trên ' + b;
                });

            return s.replace(/\s{2,}/g, ' ').trim();
        }

        function postprocessGeometrySpeechVi(spokenText) {
            if (!spokenText) return '';
            return String(spokenText)
                .replace(/\bmở\s+ngoặc\s+g\s*\.?\s*g\s+đóng\s+ngoặc\b/gi, 'theo trường hợp góc - góc')
                .replace(/\bmở\s+ngoặc\s+c\s*\.?\s*g\s*\.?\s*c\s+đóng\s+ngoặc\b/gi, 'theo trường hợp cạnh - góc - cạnh')
                .replace(/\bmở\s+ngoặc\s+c\s*\.?\s*c\s*\.?\s*c\s+đóng\s+ngoặc\b/gi, 'theo trường hợp cạnh - cạnh - cạnh')
                .replace(/\bmở\s+ngoặc\s+đpcm\s+đóng\s+ngoặc\b/gi, 'điều phải chứng minh')
                .replace(/\bmở\s+ngoặc\s+cmt\s+đóng\s+ngoặc\b/gi, 'chứng minh trên')
                .replace(/\bmở\s+ngoặc\s+gt\s+đóng\s+ngoặc\b/gi, 'theo giả thiết')
                .replace(/\s*,\s*,\s*/g, ', ')
                .replace(/\s*,\s*([;.:!?])/g, '$1')
                .replace(/\s+([,.;!?])/g, '$1')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        window.preprocessGeometryAndMathForSpeech = preprocessGeometryAndMathForSpeech;
        window.postprocessGeometrySpeechVi = postprocessGeometrySpeechVi;

        if (typeof mathToSpeech === 'function' && (!window.mathToSpeechViCore || !window.mathToSpeechViCore.__hasUnifiedGeoSpeech)) {
            try { mathToSpeech(''); } catch (e) {}
        }

        var upgradedViCore = null;
        if (typeof window.mathToSpeechViCore === 'function' && !window.mathToSpeechViCore.__hasUnifiedGeoSpeech) {
            var origViCore = window.mathToSpeechViCore;
            upgradedViCore = function mathToSpeechViCore(rawViInput) {
                var pre = preprocessGeometryAndMathForSpeech(rawViInput);
                var out = origViCore(pre);
                return postprocessGeometrySpeechVi(out);
            };
            upgradedViCore.__hasUnifiedGeoSpeech = true;
            window.mathToSpeechViCore = upgradedViCore;
        } else if (typeof window.mathToSpeechViCore === 'function') {
            upgradedViCore = window.mathToSpeechViCore;
        }

        if (typeof window.mathToSpeech === 'function' && !window.mathToSpeech.__hasUnifiedGeoSpeech) {
            var origMathToSpeech = window.mathToSpeech;
            var origMathToSpeechSrc = origMathToSpeech.__origSourceString || origMathToSpeech.toString();
            var upgradedMathToSpeech = function mathToSpeech(input) {
                if (input === null || input === undefined) return '';
                var pre = preprocessGeometryAndMathForSpeech(input);
                var out = origMathToSpeech(pre);
                if (typeof upgradedViCore === 'function') window.mathToSpeechViCore = upgradedViCore;
                return postprocessGeometrySpeechVi(out);
            };
            upgradedMathToSpeech.__hasUnifiedGeoSpeech = true;
            upgradedMathToSpeech.__origSourceString = origMathToSpeechSrc;
            upgradedMathToSpeech.toString = function() {
                return origMathToSpeechSrc + '\n;(' + installUnifiedMathSpeechEngine.toString() + ')();';
            };
            try { mathToSpeech = upgradedMathToSpeech; } catch (e) {}
            window.mathToSpeech = upgradedMathToSpeech;
        }

        if (typeof window.defaultMathToSpeech === 'function' && !window.defaultMathToSpeech.__hasUnifiedGeoSpeech) {
            var origDefSpeech = window.defaultMathToSpeech;
            var origDefSpeechSrc = origDefSpeech.__origSourceString || origDefSpeech.toString();
            var upgradedDefSpeech = function defaultMathToSpeech(text) {
                if (typeof window.mathToSpeech === 'function') return window.mathToSpeech(text);
                return postprocessGeometrySpeechVi(origDefSpeech(preprocessGeometryAndMathForSpeech(text)));
            };
            upgradedDefSpeech.__hasUnifiedGeoSpeech = true;
            upgradedDefSpeech.__origSourceString = origDefSpeechSrc;
            upgradedDefSpeech.toString = function() {
                return origDefSpeechSrc;
            };
            try { defaultMathToSpeech = upgradedDefSpeech; } catch (e) {}
            window.defaultMathToSpeech = upgradedDefSpeech;
        }
    })();</script>
<script>(function(){

function rotateAndProject3DPoint(pt3d, rotOpts, center2d, baseScale) {
        var yaw = ((rotOpts && typeof rotOpts.yaw === 'number') ? rotOpts.yaw : -26) * Math.PI / 180;
        var pitch = ((rotOpts && typeof rotOpts.pitch === 'number') ? rotOpts.pitch : 20) * Math.PI / 180;
        var roll = ((rotOpts && typeof rotOpts.roll === 'number') ? rotOpts.roll : 0) * Math.PI / 180;
        var zoom = (rotOpts && typeof rotOpts.zoom === 'number') ? rotOpts.zoom : 1.0;
        var projMode = (rotOpts && rotOpts.projection) || 'ortho';

        var x = pt3d.x || 0, y = pt3d.y || 0, z = pt3d.z || 0;
        // 1. Rotate around Y axis (Yaw)
        var cosY = Math.cos(yaw), sinY = Math.sin(yaw);
        var x1 = x * cosY + z * sinY;
        var y1 = y;
        var z1 = -x * sinY + z * cosY;

        // 2. Rotate around X axis (Pitch)
        var cosP = Math.cos(pitch), sinP = Math.sin(pitch);
        var x2 = x1;
        var y2 = y1 * cosP - z1 * sinP;
        var z2 = y1 * sinP + z1 * cosP;

        // 3. Rotate around Z axis (Roll)
        var cosR = Math.cos(roll), sinR = Math.sin(roll);
        var x3 = x2 * cosR - y2 * sinR;
        var y3 = x2 * sinR + y2 * cosR;
        var z3 = z2;

        var scale = (baseScale || 1.0) * zoom;
        var perspFactor = 1.0;
        if (projMode === 'persp') {
            var camDist = 380;
            perspFactor = camDist / Math.max(120, camDist - z3 * scale);
        }
        return {
            x: center2d.x + x3 * scale * perspFactor,
            y: center2d.y - y3 * scale * perspFactor,
            z: z3,
            camX: x3,
            camY: y3,
            camZ: z3
        };
    }
function computeFaceOutwardNormalZ(faceVertKeys, pts3d, ptsProj) {
        if (!faceVertKeys || faceVertKeys.length < 3) return 0;
        var p0 = pts3d[faceVertKeys[0]], p1 = pts3d[faceVertKeys[1]], p2 = pts3d[faceVertKeys[2]];
        if (!p0 || !p1 || !p2) return 0;

        // Compute 3D centroid of all main vertices
        var cx = 0, cy = 0, cz = 0, cnt = 0;
        var allKeys = Object.keys(pts3d);
        for (var i = 0; i < allKeys.length; i++) {
            var k = allKeys[i];
            if (pts3d[k] && pts3d[k].isMainPolyVertex) {
                cx += pts3d[k].x; cy += pts3d[k].y; cz += pts3d[k].z;
                cnt++;
            }
        }
        if (cnt > 0) { cx /= cnt; cy /= cnt; cz /= cnt; }

        // Face center in 3D
        var fx = 0, fy = 0, fz = 0;
        for (var j = 0; j < faceVertKeys.length; j++) {
            var fv = pts3d[faceVertKeys[j]];
            if (fv) { fx += fv.x; fy += fv.y; fz += fv.z; }
        }
        fx /= faceVertKeys.length; fy /= faceVertKeys.length; fz /= faceVertKeys.length;

        // 3D normal (p1 - p0) x (p2 - p0)
        var ux = p1.x - p0.x, uy = p1.y - p0.y, uz = p1.z - p0.z;
        var vx = p2.x - p0.x, vy = p2.y - p0.y, vz = p2.z - p0.z;
        var nx = uy * vz - uz * vy;
        var ny = uz * vx - ux * vz;
        var nz = ux * vy - uy * vx;

        // Ensure normal points outward from solid centroid
        var dotOut = nx * (fx - cx) + ny * (fy - cy) + nz * (fz - cz);
        var sign = dotOut < 0 ? -1 : 1;

        // Now compute camera-space Z normal using rotated camera coordinates
        var c0 = ptsProj[faceVertKeys[0]], c1 = ptsProj[faceVertKeys[1]], c2 = ptsProj[faceVertKeys[2]];
        var cux = c1.camX - c0.camX, cuy = c1.camY - c0.camY;
        var cvx = c2.camX - c0.camX, cvy = c2.camY - c0.camY;
        var camNz = (cux * cvy - cuy * cvx) * sign;
        return camNz;
    }
function isInterdisciplinary3DPrompt(txt) {
        var s = String(txt || '').trim();
        if (!s) return false;
        // Hóa học 3D: Mô hình phân tử không gian 3D (CH4, H2O, CO2, NH3, C2H4, C2H2, C6H6, O2, N2, HCl, SO2)

                    rOsc1.stop(rt + 1.05); rOsc2.stop(rt + 1.05);
                }
            }
        }
        window.__playAnimalRescueSound = playAnimalRescueSound;

        // ============== GIỌNG ĐỌC AI (TTS) ==============
        var ttsToken = 0, ttsAudio = null;
        function stopSpeech() {
            ttsToken++;
            if (ttsAudio) { try { ttsAudio.pause(); } catch (e) {} ttsAudio = null; }
            if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
        }
        function speakVi(txt, cb) {
            stopSpeech();
            var token = ttsToken;
            var done = function() { if (token !== ttsToken) return; if (cb) cb(); };
            var cleanTxt = (typeof mathToSpeech === 'function') ? mathToSpeech(txt) : String(txt || '');
            if (!cleanTxt.trim()) { done(); return; }
            if ('speechSynthesis' in window) {
                var u = new SpeechSynthesisUtterance(cleanTxt);
                u.lang = 'vi-VN';
                u.rate = Number(window.__INITIAL_TTS_RATE) || 1.0;
                u.onend = done; u.onerror = done;
                window.speechSynthesis.speak(u);
            } else {
                done();
            }
        }

                            colors: ['#fde047', '#34d399', '#38bdf8', '#f472b6']
                        });
                        confetti({
                            particleCount: 45,
                            angle: 120,
                            spread: 55,
                            origin: { x: 0.82, y: 0.72 },
                            colors: ['#fde047', '#34d399', '#38bdf8', '#fb923c']
                        });
                    }
                } catch (e) {}
            }

            // 2. Bộ bắn pháo giấy DOM/CSS nội tuyến 100% Offline (Đảm bảo luôn nổ pháo giấy rực rỡ kể cả khi không có mạng Internet)
            try {
                if (!document || !document.createElement) return;
                var layer = document.getElementById('rescue-offline-confetti-layer');
                if (!layer && document.body && typeof document.body.appendChild === 'function') {
                    layer = document.createElement('div');
                    layer.id = 'rescue-offline-confetti-layer';
                    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:19999;overflow:hidden;';
                    document.body.appendChild(layer);
                }
                if (!layer || typeof layer.appendChild !== 'function') return;
                var count = isVictory ? 72 : (isStation ? 54 : 36);
                var palette = ['#fde047', '#34d399', '#38bdf8', '#f472b6', '#fb923c', '#a78bfa', '#4ade80', '#f87171'];
                for (var ci = 0; ci < count; ci++) {
                    var piece = document.createElement('div');
                    var col = palette[ci % palette.length];
                    var startX = 15 + Math.random() * 70;
                    var driftX = (Math.random() - 0.5) * 340;
                    var fallY = 380 + Math.random() * 340;
                    var rot = Math.round(360 + Math.random() * 720);
                    var dur = (1.05 + Math.random() * 0.85).toFixed(2);
                    var w = (8 + Math.round(Math.random() * 6)) + 'px';
                    var h = (12 + Math.round(Math.random() * 8)) + 'px';
                    piece.className = 'rescue-confetti-piece';
                    piece.style.cssText =
                        'position:absolute;left:' + startX.toFixed(1) + '%;top:52%;width:' + w + ';height:' + h + ';' +
                        'background:' + col + ';border-radius:3px;opacity:0.96;box-shadow:0 0 6px rgba(0,0,0,0.25);' +
                        'transform:translate(0,0) rotate(0deg);' +
                        'transition:transform ' + dur + 's cubic-bezier(.16,.84,.44,1), opacity ' + dur + 's ease-out;';
                    layer.appendChild(piece);
                    (function(el, dx, dy, r) {
                        setTimeout(function() {
                            if (el && el.style) {
                                el.style.transform = 'translate(' + dx.toFixed(0) + 'px, ' + (-190 + dy * 0.55).toFixed(0) + 'px) rotate(' + r + 'deg)';
                                el.style.opacity = '0';
                            }
                        }, 15);
                        setTimeout(function() {
                            if (el && el.parentNode) el.parentNode.removeChild(el);
                        }, 1950);
                    })(piece, driftX, fallY, rot);
                }
            } catch (e) {}
        }

        function handleSelectAnswer(chosenIdx) {
            if (isLockedAnswering || !currentQ) return;
            isLockedAnswering = true;

            var optGrid = document.getElementById('rescue-opt-grid');
            var fbBox = document.getElementById('rescue-feedback-box');
            var btns = optGrid ? optGrid.querySelectorAll('.rescue-opt-btn') : [];
            for (var i = 0; i < btns.length; i++) {
                btns[i].disabled = true;
                if (i === currentQ.answer) btns[i].classList.add('correct');
                else if (i === chosenIdx && chosenIdx !== currentQ.answer) btns[i].classList.add('wrong');
            }

            var reqCount = customTargets[stationIdx];
            if (chosenIdx === currentQ.answer) {
                stationCorrectCount++;
                totalCorrect++;
                streak++;
                totalScore += 10 + Math.min(streak * 2, 10);
                playKeyUnlockSfx();
                // Bắn pháo giấy chúc mừng ngay khi trả lời đúng mỗi câu hỏi!
                launchRescueConfetti('question');
                renderMapAndStage();

                if (stationCorrectCount >= reqCount) {
                    unlockedStations[stationIdx] = true;
                    renderMapAndStage();
                    if (fbBox) {
                        fbBox.style.color = '#34d399';
                        fbBox.innerHTML = '🎉🔓 ĐÃ ĐỦ ' + reqCount + '/' + reqCount + ' CHÌA KHÓA! CỬA LỒNG TRẠM ' + (stationIdx + 1) + ' ĐANG MỞ TUNG!';
                    }
                    setTimeout(function() {
                        showStationRescueModal(stationIdx, false);
                    }, 550);
                } else {
                    if (fbBox) {
                        fbBox.style.color = '#34d399';
                        fbBox.innerHTML = '🎉 Chính xác! Pháo giấy chúc mừng — đã mở được ' + stationCorrectCount + '/' + reqCount + ' chốt khóa của Trạm ' + (stationIdx + 1) + '!';
                    }
                    setTimeout(function() {
                        renderQuestionPanel();
                    }, 1150);
                }
            } else {
                streak = 0;
                playWrongLockRattleSfx();
                if (fbBox) {
                    fbBox.style.color = '#fca5a5';
                    fbBox.innerHTML = '⚠️ Chưa đúng (Đáp án đúng là ' + 'ABCD'.charAt(currentQ.answer) + '). Chốt khóa vẫn đóng, hãy trả lời câu tiếp theo để mở tiếp nhé!';
                }
                setTimeout(function() {
                    renderQuestionPanel();
                }, 1700);
            }
        }
