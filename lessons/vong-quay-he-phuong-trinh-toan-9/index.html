<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<meta name="referrer" content="no-referrer">
<script>function installSafety() {
    // 1) Canvas: bù ctx.roundRect cho trình duyệt cũ
    try {
        var P = window.CanvasRenderingContext2D && window.CanvasRenderingContext2D.prototype;
        if (P && !P.roundRect) P.roundRect = function (x, y, w, h, r) {
            r = typeof r === "number" ? r : (r && r.length ? r[0] : 0); r = Math.max(0, Math.min(r, w / 2, h / 2));
            this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
        };
    } catch (e) { }
    // 2) Giọng đọc của trình duyệt: WebView (Zalo...) thường KHÔNG có speechSynthesis -> bù bản giả để game không chết
    try {
        if (!window.speechSynthesis) {
            var fake = {
                speaking: false, pending: false, paused: false, onvoiceschanged: null,
                getVoices: function () { return []; },
                speak: function (u) { setTimeout(function () { try { if (u && u.onend) u.onend({}); } catch (e) { } }, 0); },
                cancel: function () { }, pause: function () { }, resume: function () { },
                addEventListener: function () { }, removeEventListener: function () { }
            };
            Object.defineProperty(window, "speechSynthesis", { value: fake, configurable: true, writable: true });
            window.__fakeTTS = true;
        }
        if (!window.SpeechSynthesisUtterance) {
            window.SpeechSynthesisUtterance = function (t) { this.text = t; this.lang = ""; this.voice = null; this.rate = 1; this.pitch = 1; this.volume = 1; };
        }
    } catch (e) { }
    // 2b) Giọng trình duyệt đã chọn lúc tạo game (vd Hoài My) có thể KHÔNG có trên điện thoại học sinh -> game tự chuyển sang giọng Google
    window.__voiceMissing = function (name) {
        try {
            var vs = window.speechSynthesis.getVoices();
            if (!vs || !vs.length) return false;
            for (var i = 0; i < vs.length; i++) { if (vs[i].name === name || vs[i].voiceURI === name) return false; }
            return true;
        } catch (e) { return false; }
    };
    // 3) Âm thanh hiệu ứng: nếu không có AudioContext thì bù bản im lặng
    try {
        if (!window.AudioContext && !window.webkitAudioContext) {
            var param = function () { return { value: 0, setValueAtTime: function () { }, linearRampToValueAtTime: function () { }, exponentialRampToValueAtTime: function () { }, setTargetAtTime: function () { }, cancelScheduledValues: function () { } }; };
            var node = function () { return { connect: function (n) { return n; }, disconnect: function () { }, start: function () { }, stop: function () { }, type: "", frequency: param(), gain: param(), detune: param(), Q: param(), buffer: null, loop: false }; };
            window.AudioContext = function () {
                this.state = "running"; this.currentTime = 0; this.sampleRate = 44100; this.destination = node();
                this.resume = function () { return Promise.resolve(); }; this.suspend = this.resume; this.close = this.resume;
                this.createOscillator = node; this.createGain = node; this.createBiquadFilter = node; this.createBufferSource = node;
                this.createBuffer = function () { return { getChannelData: function () { return []; } }; };
                this.createDynamicsCompressor = node; this.createDelay = node; this.createStereoPanner = node;
            };
        }
    } catch (e) { }
    // 4) Hiện lỗi JS (cộng dồn) ở góc dưới màn hình để chẩn đoán trên điện thoại
    var errs = [];
    window.addEventListener("error", function (e) {
        try {
            if (!e || !e.message) return;
            if (String(location.href).indexOf("debug") < 0) return; // chỉ hiện khung lỗi khi mở link có thêm ?debug (để chẩn đoán); học sinh không thấy
            errs.push(e.message + " (dong " + (e.lineno || "?") + ")");
            if (errs.length > 4) errs.shift();
            var d = document.getElementById("__err");
            if (!d) {
                d = document.createElement("div"); d.id = "__err";
                d.style.cssText = "position:fixed;left:4px;bottom:4px;right:150px;z-index:2147483647;background:rgba(150,0,0,.9);color:#fff;font:11px/1.3 monospace;padding:4px 6px;border-radius:4px;pointer-events:none;max-height:140px;overflow:hidden;white-space:pre-wrap;word-break:break-all";
                (document.body || document.documentElement).appendChild(d);
            }
            d.textContent = "Loi: " + errs.join("\n");
        } catch (x) { }
    });
}
function installConfettiFallback() {
    if (typeof window.confetti === "function") return;
    var cv = null, cx = null, bits = [], running = false;
    var COLORS = ["#ff4d4d", "#ffd93d", "#4dd0e1", "#7cff6b", "#ff7ad9", "#ffffff", "#ffa726"];
    function ensure() {
        if (cv) return;
        cv = document.createElement("canvas");
        cv.style.cssText = "position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:99999";
        cv.width = window.innerWidth; cv.height = window.innerHeight;
        document.body.appendChild(cv); cx = cv.getContext("2d");
        window.addEventListener("resize", function () { cv.width = window.innerWidth; cv.height = window.innerHeight; });
    }
    function step() {
        cx.clearRect(0, 0, cv.width, cv.height);
        for (var i = bits.length - 1; i >= 0; i--) {
            var p = bits[i];
            p.vy += 0.35; p.vx *= 0.992; p.vy *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.006;
            if (p.y > cv.height + 30 || p.life <= 0) { bits.splice(i, 1); continue; }
            cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, p.life * 2); cx.fillStyle = p.c;
            cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
        }
        if (bits.length) requestAnimationFrame(step); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
    }
    window.confetti = function (opts) {
        opts = opts || {}; ensure();
        var n = Math.min(opts.particleCount || 100, 220);
        var o = opts.origin || {};
        var ox = (o.x === undefined ? 0.5 : o.x) * cv.width, oy = (o.y === undefined ? 0.5 : o.y) * cv.height;
        var spread = opts.spread || 60, angle = opts.angle === undefined ? 90 : opts.angle;
        for (var i = 0; i < n; i++) {
            var a = (angle + (Math.random() - 0.5) * spread) * Math.PI / 180, v = 12 + Math.random() * 14;
            bits.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 1 });
        }
        if (!running) { running = true; requestAnimationFrame(step); }
    };
}
function installTtsUnlock() {
    var el = null, unlocked = false;
    var SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=";
    window.ttsEl = function (url) {
        if (!el) el = new Audio();
        el.onended = null; el.onerror = null; el.src = url;
        return el;
    };
    function unlock() {
        if (unlocked) return; unlocked = true;
        try {
            if (el && !el.paused) return;
            var p = window.ttsEl(SILENT).play();
            if (p && p.catch) p.catch(function () { unlocked = false; });
        } catch (e) { unlocked = false; }
    }
    document.addEventListener("pointerdown", unlock, true);
    document.addEventListener("touchend", unlock, true);
    document.addEventListener("click", unlock, true);
}
function installLandscape() {
    var skipped = false, box = null, tried = false;
    function isPhone() {
        var coarse = false;
        try { coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches); } catch (e) { }
        return coarse && Math.min(window.innerWidth, window.innerHeight) < 700;
    }
    function build() {
        box = document.createElement("div"); box.id = "__rot";
        box.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:rgba(12,20,48,.97);color:#ffd166;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font:bold 22px/1.5 Arial,sans-serif;touch-action:manipulation";
        box.innerHTML = '<div style="font-size:72px;animation:__spin 1.6s ease-in-out infinite alternate">\uD83D\uDCF1</div>' +
            '<div style="margin-top:14px">Xoay ngang điện thoại<br>để chơi dễ hơn nhé!</div>' +
            '<div style="margin-top:8px;font-size:15px;font-weight:normal;color:#fff;opacity:.8">(hoặc chạm vào màn hình để tự xoay)</div>' +
            '<button id="__skip" style="margin-top:26px;padding:10px 18px;font-size:16px;border-radius:10px;border:2px solid #ffd166;background:transparent;color:#ffd166;cursor:pointer">Vẫn chơi màn hình dọc</button>';
        var st = document.createElement("style"); st.textContent = "@keyframes __spin{from{transform:rotate(0)}to{transform:rotate(-90deg)}}";
        (document.head || document.documentElement).appendChild(st);
        (document.body || document.documentElement).appendChild(box);
        document.getElementById("__skip").addEventListener("click", function (ev) { ev.stopPropagation(); skipped = true; update(); });
    }
    function update() {
        var need = isPhone() && window.innerHeight > window.innerWidth && !skipped;
        if (need && !box && document.body) build();
        if (box) box.style.display = need ? "flex" : "none";
    }
    function tryLock(ev) {
        if (tried || skipped || !isPhone()) return;
        if (ev && ev.target && ev.target.id === "__skip") return;
        tried = true;
        try {
            var de = document.documentElement, rq = de.requestFullscreen || de.webkitRequestFullscreen;
            var lockIt = function () { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () { }); } catch (e) { } };
            var pr = rq ? rq.call(de) : null;
            if (pr && pr.then) pr.then(lockIt).catch(function () { lockIt(); }); else lockIt();
        } catch (e) { }
    }
    window.addEventListener("resize", update); window.addEventListener("orientationchange", function () { setTimeout(update, 200); });
    document.addEventListener("pointerup", tryLock, true); document.addEventListener("click", tryLock, true);
    var n = 0, iv = setInterval(function () { update(); if (++n > 20) clearInterval(iv); }, 300);
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", update); else update();
}
installSafety();
installConfettiFallback();
installTtsUnlock();
installLandscape();</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#0d1117;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;}
.wheel-app{display:flex;flex-direction:column;height:100%;width:100%;max-width:1200px;margin:0 auto;position:relative;}

/* Header Bar */
.wheel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(22,27,34,0.9);border-bottom:1px solid #30363d;z-index:10;}
.wheel-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.wheel-stats{display:flex;align-items:center;gap:12px;font-size:14px;}
.stat-pill{background:#21262d;border:1px solid #30363d;padding:4px 10px;border-radius:20px;font-weight:600;}
.stat-pill b{color:#feca57;}
.hdr-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;transition:0.2s;}
.hdr-btn:hover{background:#30363d;color:#fff;}

/* Main Layout */
.wheel-main{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:10px;}
@media (max-width:850px){
  .wheel-main{flex-direction:column;justify-content:center;gap:10px;}
}

/* Wheel Container */
.wheel-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:10px;}
.canvas-wrap{position:relative;width:min(70vh, 480px, 90vw);height:min(70vh, 480px, 90vw);display:flex;align-items:center;justify-content:center;}
canvas#wheelCanvas{width:100%;height:100%;filter:drop-shadow(0 10px 25px rgba(0,0,0,0.6));border-radius:50%;}

/* Pointer Needle */
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:36px;height:48px;z-index:20;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));transform-origin:50% 12px;transition:transform 0.05s ease-out;}
.wheel-pointer svg{width:100%;height:100%;}

/* Center Spin Button */
.center-spin-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:radial-gradient(circle,#ff4757,#b33939);border:4px solid #fff;box-shadow:0 0 20px rgba(255,71,87,0.8),inset 0 2px 4px rgba(255,255,255,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;cursor:pointer;z-index:25;transition:transform 0.15s,box-shadow 0.15s;text-transform:uppercase;letter-spacing:1px;}
.center-spin-btn:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 30px rgba(255,71,87,1);}
.center-spin-btn:active:not(:disabled){transform:translate(-50%,-50%) scale(0.95);}
.center-spin-btn:disabled{opacity:0.6;cursor:not-allowed;}
.center-spin-btn span{font-size:10px;font-weight:normal;opacity:0.9;}

/* Info & Controls Panel */
.wheel-sidebar{width:320px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:12px;background:rgba(22,27,34,0.7);border-radius:16px;border:1px solid #30363d;backdrop-filter:blur(10px);z-index:5;}
@media (max-width:850px){
  .wheel-sidebar{width:min(90vw, 480px);flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 12px;}
}
.sidebar-title{font-size:15px;font-weight:700;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.q-progress-list{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow-y:auto;padding-right:4px;}
.q-tag{font-size:12px;padding:4px 8px;border-radius:8px;background:#21262d;border:1px solid #30363d;color:#8b949e;display:flex;align-items:center;gap:4px;}
.q-tag.done{background:rgba(46,160,67,0.2);border-color:#2ea043;color:#3fb950;}
.q-tag.active{background:rgba(56,139,253,0.3);border-color:#58a6ff;color:#58a6ff;}

.spin-action-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(255,71,87,0.4);transition:0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.spin-action-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,71,87,0.6);}
.spin-action-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* Question Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.25s ease-out;padding:16px;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.q-card{width:min(94vw, 680px);background:#161b22;border:2px solid #58a6ff;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(88,166,255,0.3);overflow:hidden;transform:scale(0.9);transition:transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);display:flex;flex-direction:column;}
.modal-overlay.show .q-card{transform:scale(1);}

.card-hdr{padding:14px 20px;background:linear-gradient(90deg,#1f2937,#111827);border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;}
.card-tag{font-size:14px;font-weight:700;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.card-speaker{background:#21262d;border:1px solid #30363d;color:#58a6ff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;}

.card-body{padding:20px;display:flex;flex-direction:column;gap:16px;}
.q-text{font-size:19px;font-weight:600;line-height:1.5;color:#f0f6fc;text-align:left;}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:550px){.options-grid{grid-template-columns:1fr;}}

.opt-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#21262d;border:2px solid #30363d;border-radius:12px;color:#c9d1d9;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:left;position:relative;}
.opt-btn:hover:not(:disabled){background:#30363d;border-color:#58a6ff;color:#fff;transform:translateY(-2px);}
.opt-btn .opt-badge{width:32px;height:32px;border-radius:8px;background:#30363d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
.opt-btn.correct{background:rgba(46,160,67,0.25)!important;border-color:#2ea043!important;color:#3fb950!important;}
.opt-btn.correct .opt-badge{background:#2ea043;color:#fff;}
.opt-btn.wrong{background:rgba(248,81,73,0.25)!important;border-color:#f85149!important;color:#ff7b72!important;animation:shake 0.4s;}
.opt-btn.wrong .opt-badge{background:#f85149;color:#fff;}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-8px);}
  40%,80%{transform:translateX(8px);}
}

.feedback-bar{padding:12px 16px;border-radius:10px;font-weight:600;display:none;align-items:center;gap:10px;font-size:15px;}
.feedback-bar.correct{background:rgba(46,160,67,0.2);border:1px solid #2ea043;color:#3fb950;display:flex;}
.feedback-bar.wrong{background:rgba(248,81,73,0.2);border:1px solid #f85149;color:#ff7b72;display:flex;}

.card-ftr{padding:14px 20px;background:#111827;border-top:1px solid #30363d;display:flex;justify-content:flex-end;gap:12px;}
.next-spin-btn{padding:10px 24px;border:none;border-radius:10px;background:linear-gradient(135deg,#238636,#2ea043);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:none;}
.next-spin-btn.show{display:inline-flex;align-items:center;gap:6px;}

/* Victory Screen */
.victory-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:0.3s;padding:20px;}
.victory-modal.show{opacity:1;pointer-events:auto;}
.victory-card{background:#161b22;border:2px solid #feca57;border-radius:24px;padding:32px;max-width:500px;width:100%;text-align:center;box-shadow:0 0 50px rgba(254,202,87,0.4);display:flex;flex-direction:column;align-items:center;gap:16px;}
.victory-trophy{font-size:64px;animation:bounce 1s infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-12px);}}
.victory-title{font-size:26px;font-weight:800;color:#feca57;}
.victory-desc{font-size:16px;color:#8b949e;line-height:1.5;}
.victory-score{font-size:36px;font-weight:900;color:#3fb950;margin:10px 0;}
.btn-replay{padding:12px 30px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="wheel-app">
  <!-- Header -->
  <div class="wheel-hdr">
    <div class="wheel-title">🎡 VÒNG QUAY MAY MẮN</div>
    <div class="wheel-stats">
      <div class="stat-pill">Điểm: <b id="uiScore">0</b></div>
      <div class="stat-pill">Đã mở: <b id="uiOpened">0</b>/<span id="uiTotal">0</span></div>
      <button class="hdr-btn" id="btnSound" type="button">🔊 Bật</button>
      <button class="hdr-btn" id="btnFullscreen" type="button">⛶ Toàn màn hình</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="wheel-main">
    <div class="wheel-stage">
      <div class="canvas-wrap">
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
        <div class="wheel-pointer" id="wheelPointer">
          <svg viewBox="0 0 40 50">
            <polygon points="5,0 35,0 20,48" fill="#feca57" stroke="#fff" stroke-width="3" />
            <circle cx="20" cy="12" r="6" fill="#ff4757" />
          </svg>
        </div>
        <button class="center-spin-btn" id="btnCenterSpin" type="button">
          QUAY
          <span>CHẠM ĐÂY</span>

      </div>
    </div>

    <!-- Sidebar Controls -->
    <div class="wheel-sidebar">
      <div class="sidebar-title">📋 DANH SÁCH CÂU HỎI</div>
      <div class="q-progress-list" id="qProgressList"></div>
      <button class="spin-action-btn" id="btnBigSpin" type="button">🎯 QUAY NGAY</button>
    </div>
  </div>
</div>

<!-- Question Modal -->
<div class="modal-overlay" id="qModal">
  <div class="q-card">
    <div class="card-hdr">
      <div class="card-tag" id="modalTag">🎡 CÂU HỎI SỐ 1</div>
      <button class="card-speaker" id="btnSpeaker" type="button">🔊 Đọc câu hỏi</button>
    </div>
    <div class="card-body">
      <div class="q-text" id="modalQuestion">Nội dung câu hỏi...</div>
      <div class="options-grid" id="modalOptions"></div>
      <div class="feedback-bar" id="modalFeedback"></div>
    </div>
    <div class="card-ftr">
      <button class="next-spin-btn" id="btnNextSpin" type="button">Quay tiếp ➔</button>
    </div>
  </div>

        // Slice i center at (angle + (i + 0.5)*sliceAngle)
        // We want (angle + (targetIdx + 0.5)*sliceAngle) = -PI/2 + 2*PI*K
        const fullRounds = 4 + Math.floor(Math.random() * 3); // 4 to 6 full rounds
        const currentA = state.angle % (2 * Math.PI);
        const targetA = (3 * Math.PI / 2) - ((targetIdx + 0.5) * sliceAngle);
        let diff = (targetA - currentA) % (2 * Math.PI);
        if (diff < 0) diff += 2 * Math.PI;

        const totalRotation = fullRounds * (2 * Math.PI) + diff;
        const startAngle = state.angle;
        const duration = 4000; // ms
        const startTime = performance.now();

        const pointerEl = document.getElementById('wheelPointer');

        function animate(now) {
            const elapsed = now - startTime;
            const progress = Math.min(1, elapsed / duration);
            // Cubic ease out
            const ease = 1 - Math.pow(1 - progress, 3);
            state.angle = startAngle + totalRotation * ease;

            // Pointer tick calculation
            const normalizedAngle = (state.angle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            // which slice is at top
            const pointerAngle = (3 * Math.PI / 2 - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
            const currentSlice = Math.floor(pointerAngle / sliceAngle) % N;

            if (currentSlice !== lastTickSlice) {
                lastTickSlice = currentSlice;
                playTick();
                if (pointerEl) {
                    pointerEl.style.transform = 'translateX(-50%) rotate(-18deg)';
                    setTimeout(() => {
                        if (pointerEl) pointerEl.style.transform = 'translateX(-50%) rotate(0deg)';
                    }, 40);
                }
            }

            drawWheel();

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                state.isSpinning = false;
                document.getElementById('btnCenterSpin').disabled = false;
                document.getElementById('btnBigSpin').disabled = false;
                playFanfare();
                setTimeout(() => openQuestion(targetIdx), 500);
            }
        }

        requestAnimationFrame(animate);
    }

    function pickNextIndex() {
        const available = [];
        for (let i = 0; i < N; i++) {
            if (!state.completed.has(i)) available.push(i);
        }
        if (available.length === 0) return -1;
        return available[Math.floor(Math.random() * available.length)];
    }

    function startSpin() {
        if (state.isSpinning) return;
        const nextIdx = pickNextIndex();
        if (nextIdx === -1) {
            showVictory();
            return;
        }
        spinTo(nextIdx);
    }

    // Modal Question Handling
    function openQuestion(idx) {
        state.currentIdx = idx;
        const qData = questions[idx];
        const modal = document.getElementById('qModal');
        const tag = document.getElementById('modalTag');
        const qText = document.getElementById('modalQuestion');
        const optsContainer = document.getElementById('modalOptions');
        const fb = document.getElementById('modalFeedback');
        const nextBtn = document.getElementById('btnNextSpin');

        tag.textContent = '🎡 CÂU HỎI SỐ ' + (idx + 1) + ' / ' + N;
        qText.innerHTML = (typeof gameFormatMath === 'function') ? gameFormatMath(qData.q) : qData.q;
        optsContainer.innerHTML = '';
        fb.className = 'feedback-bar';
        fb.textContent = '';
        nextBtn.className = 'next-spin-btn';

        const LETTERS = ['A', 'B', 'C', 'D'];
        (qData.options || []).forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.type = 'button';
            btn.innerHTML = '<span class="opt-badge">' + LETTERS[optIdx] + '</span><span class="opt-text">' + 
                ((typeof gameFormatMath === 'function') ? gameFormatMath(opt) : opt) + '</span>';
            btn.onclick = () => selectOption(optIdx);
            optsContainer.appendChild(btn);
        });

        modal.classList.add('show');

        // AI read out loud
        let speech = 'Câu hỏi số ' + (idx + 1) + '. ' + qData.q + '. ';
        (qData.options || []).forEach((opt, i) => {
            speech += 'Đáp án ' + LETTERS[i] + ': ' + opt + '. ';
        });
        speakText(speech);

        document.getElementById('btnSpeaker').onclick = () => speakText(speech);
    }

    function selectOption(optIdx) {
        const qData = questions[state.currentIdx];
        const opts = document.querySelectorAll('.opt-btn');
        opts.forEach(b => b.disabled = true);

        const isCorrect = (optIdx === qData.answer);
        const fb = document.getElementById('modalFeedback');
        const nextBtn = document.getElementById('btnNextSpin');

        if (isCorrect) {
            opts[optIdx].classList.add('correct');
            state.score += 100;
            state.completed.add(state.currentIdx);
            fb.className = 'feedback-bar correct';
            fb.textContent = '🎉 CHÍNH XÁC! Bạn được cộng 100 điểm!';
            playFanfare();
            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
            speakText('Chính xác! Bạn được cộng 100 điểm!');
        } else {
            opts[optIdx].classList.add('wrong');
            if (opts[qData.answer]) opts[qData.answer].classList.add('correct');
            fb.className = 'feedback-bar wrong';
            const LETTERS = ['A', 'B', 'C', 'D'];
            fb.textContent = '❌ CHƯA ĐÚNG! Đáp án chính xác là ' + LETTERS[qData.answer] + '.';
            playBuzz();
            speakText('Chưa đúng rồi. Đáp án chính xác là ' + LETTERS[qData.answer]);
        }

        updateUI();
        nextBtn.className = 'next-spin-btn show';
        nextBtn.onclick = () => {
            document.getElementById('qModal').classList.remove('show');
            window.speechSynthesis.cancel();
            if (state.completed.size >= N) {
                setTimeout(showVictory, 400);
            }
        };
    }

    function updateUI() {
        document.getElementById('uiScore').textContent = state.score;
        document.getElementById('uiOpened').textContent = state.completed.size;
        document.getElementById('uiTotal').textContent = N;

        const list = document.getElementById('qProgressList');
        list.innerHTML = '';
        for (let i = 0; i < N; i++) {
            const tag = document.createElement('div');
            const isDone = state.completed.has(i);
            tag.className = 'q-tag' + (isDone ? ' done' : '');
            tag.textContent = (isDone ? '✓ ' : '') + 'C' + (i + 1);
            list.appendChild(tag);
        }
        drawWheel();
    }

    function showVictory() {
        const vModal = document.getElementById('victoryModal');
        document.getElementById('victoryScore').textContent = state.score + ' ĐIỂM';
        vModal.classList.add('show');
        playFanfare();
        if (typeof confetti === 'function') {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
        }
        speakText('Chúc mừng bạn đã hoàn thành xuất sắc tất cả các câu hỏi trên vòng quay may mắn!');
    }

    // Button event listeners
    document.getElementById('btnCenterSpin').onclick = startSpin;
    document.getElementById('btnBigSpin').onclick = startSpin;

    document.getElementById('btnSound').onclick = function() {
        state.soundEnabled = !state.soundEnabled;
        this.textContent = state.soundEnabled ? '🔊 Bật' : '🔇 Tắt';
        if (!state.soundEnabled) window.speechSynthesis.cancel();
    };

    document.getElementById('btnFullscreen').onclick = function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen().catch(() => {});
        }
    };

    document.getElementById('btnReplay').onclick = function() {
        state.score = 0;
        state.completed.clear();
        state.currentIdx = -1;
        document.getElementById('victoryModal').classList.remove('show');
        updateUI();
    };

    // Responsive Canvas Resize
    function resizeCanvas() {
        const wrap = document.querySelector('.canvas-wrap');
        if (wrap) {
            const rect = wrap.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height) * window.devicePixelRatio;
            canvas.width = size || 800;
            canvas.height = size || 800;
            drawWheel();
        }
    }
    window.addEventListener('resize', resizeCanvas);

    // Initial setup
    updateUI();
    setTimeout(resizeCanvas, 100);
}

<script>
(function(){
  if (window.__dtUniversalClassroomEngine) return;
  window.__dtUniversalClassroomEngine = true;

  // =========================================================================
  // 1. UNIVERSAL VIETNAMESE TTS ENGINE (Google Translate TTS no-referrer + WebSpeech)
  // =========================================================================
  var dtTtsToken = 0;
  var dtCurrentAudio = null;
  var dtPendingSpeechText = null;
  var dtPendingSpeechCb = null;
  var dtUserInteracted = false;
  window.dtAutoReadEnabled = true;

  function dtSplitChunks(str, maxLen) {
    maxLen = maxLen || 165;
    str = String(str || "").replace(/\s+/g, " ").trim();
    if (!str) return [];
    if (str.length <= maxLen) return [str];
    var parts = str.match(/[^.!?;:]+[.!?;:]+|[^.!?;:]+$/g) || [str];
    var chunks = [];
    var cur = "";
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (!s) continue;
      if ((cur + " " + s).trim().length <= maxLen) {
        cur = (cur + " " + s).trim();
      } else {
        if (cur) chunks.push(cur);
        if (s.length <= maxLen) {
          cur = s;
        } else {
          var words = s.split(/\s+/);
          cur = "";
          for (var w = 0; w < words.length; w++) {
            if ((cur + " " + words[w]).trim().length <= maxLen) {
              cur = (cur + " " + words[w]).trim();
            } else {
              if (cur) chunks.push(cur);
              cur = words[w];
            }
          }
        }
      }
    }
    if (cur) chunks.push(cur);
    return chunks;
  }

  function dtCleanForSpeech(rawText) {
    if (!rawText) return "";
    var s = String(rawText)
      .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, " ")
      .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, " và ")
      .replace(/&lt;/g, " nhỏ hơn ")
      .replace(/&gt;/g, " lớn hơn ");
    if (typeof window.mathToSpeech === "function") {
      try { s = window.mathToSpeech(s); } catch (e) {}
    }
    s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, " ")
         .replace(/\s+/g, " ")
         .trim();
    return s;
  }

  function dtFindViVoice() {
    if (!("speechSynthesis" in window)) return null;
    try {
      var voices = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < voices.length; i++) {
        var lang = String(voices[i].lang || "").toLowerCase();
        var name = String(voices[i].name || "").toLowerCase();
        if (lang.indexOf("vi") === 0 && (name.indexOf("natural") !== -1 || name.indexOf("online") !== -1 || name.indexOf("google") !== -1)) {
          return voices[i];
        }
      }
      for (var j = 0; j < voices.length; j++) {
        var lang2 = String(voices[j].lang || "").toLowerCase();
        if (lang2.indexOf("vi") === 0) return voices[j];
      }
    } catch (e) {}
    return null;
  }

  window.dtStopSpeech = function() {
    dtTtsToken++;
    if (dtCurrentAudio) {
      try { dtCurrentAudio.pause(); dtCurrentAudio.src = ""; } catch (e) {}
      dtCurrentAudio = null;
    }
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    var spkBtns = document.querySelectorAll("#rescue-tts-btn, #btn-question-speaker, #btnSpeaker");
    for (var i = 0; i < spkBtns.length; i++) {
      spkBtns[i].classList.remove("speaking");
    }
  };

  function dtPlayGoogleTtsChunks(chunks, idx, token, onDone, fullSpokenFallback) {
    if (token !== dtTtsToken) return;
    if (idx >= chunks.length) {
      dtCurrentAudio = null;
      if (onDone) onDone();
      return;
    }
    var chunk = chunks[idx];
    var url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=" + encodeURIComponent(chunk);
    var audio = document.createElement("audio");
    audio.setAttribute("referrerpolicy", "no-referrer");
    audio.crossOrigin = "anonymous";
    audio.preload = "auto";
    audio.src = url;
    dtCurrentAudio = audio;

    var moved = false;
    var nextChunk = function() {
      if (moved || token !== dtTtsToken) return;
      moved = true;
      dtPlayGoogleTtsChunks(chunks, idx + 1, token, onDone, fullSpokenFallback);
    };

    audio.onended = nextChunk;
    audio.onerror = function() {
      if (moved || token !== dtTtsToken) return;
      moved = true;
      dtCurrentAudio = null;
      dtSpeakWebSpeechFallback(chunks.slice(idx).join(". "), token, onDone);
    };

    var playPromise = audio.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(function(err) {
        if (token !== dtTtsToken) return;
        // If blocked by browser autoplay policy before user click, queue it for immediate playback on first click/key
        if (!dtUserInteracted && err && (err.name === "NotAllowedError" || String(err).indexOf("NotAllowed") !== -1)) {
          dtPendingSpeechText = fullSpokenFallback;
          dtPendingSpeechCb = onDone;
          dtShowAutoplayPromptBanner();
          return;
        }
        if (!moved) {
          moved = true;
          dtSpeakWebSpeechFallback(chunks.slice(idx).join(". "), token, onDone);
        }
      });
    }
  }

  function dtSpeakWebSpeechFallback(text, token, onDone) {
    if (token !== dtTtsToken) return;
    if (!("speechSynthesis" in window)) {
      if (onDone) onDone();
      return;
    }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "vi-VN";
      u.rate = 1.0;
      var viVoice = dtFindViVoice();
      if (viVoice) u.voice = viVoice;
      u.onend = function() { if (token === dtTtsToken && onDone) onDone(); };
      u.onerror = function() { if (token === dtTtsToken && onDone) onDone(); };
      window.speechSynthesis.speak(u);
    } catch (e) {
      if (onDone) onDone();
    }
  }

  window.dtSpeakVietnamese = function(rawText, onDone) {
    window.dtStopSpeech();
    var spoken = dtCleanForSpeech(rawText);
    if (!spoken) {
      if (onDone) onDone();
      return;
    }
    var token = dtTtsToken;
    var spkBtns = document.querySelectorAll("#rescue-tts-btn, #btn-question-speaker, #btnSpeaker");
    for (var i = 0; i < spkBtns.length; i++) {
      spkBtns[i].classList.add("speaking");
    }
    var finishCb = function() {
      for (var j = 0; j < spkBtns.length; j++) {
        spkBtns[j].classList.remove("speaking");
      }
      if (onDone) onDone();
    };

    // Prefer natural Vietnamese WebSpeech voice if Edge/Windows Natural Vi voice is installed, otherwise Google Translate Vi TTS (no-referrer)
    var naturalVi = dtFindViVoice();
    if (naturalVi && (String(naturalVi.name).toLowerCase().indexOf("natural") !== -1 || String(naturalVi.name).toLowerCase().indexOf("hoaimy") !== -1 || String(naturalVi.name).toLowerCase().indexOf("namminh") !== -1)) {
      dtSpeakWebSpeechFallback(spoken, token, finishCb);
      return;
    }

    var chunks = dtSplitChunks(spoken, 165);
    dtPlayGoogleTtsChunks(chunks, 0, token, finishCb, spoken);
  };

  function dtShowAutoplayPromptBanner() {
    if (document.getElementById("dt-tts-unlock-banner")) return;
    var b = document.createElement("div");
    b.id = "dt-tts-unlock-banner";
    b.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999999;background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;padding:14px 28px;border-radius:999px;font-family:system-ui,sans-serif;font-size:18px;font-weight:800;box-shadow:0 12px 35px rgba(0,0,0,0.6);border:2px solid #7dd3fc;cursor:pointer;display:flex;align-items:center;gap:10px;animation:dtPulseBanner 1.2s infinite alternate;";
    b.innerHTML = "🔊 Nhấn vào đây hoặc bất kỳ đâu để Bật đọc câu hỏi tự động & Full màn hình";
    document.body.appendChild(b);
  }

  function dtUnlockAudioAndReplayPending() {
    dtUserInteracted = true;
    var banner = document.getElementById("dt-tts-unlock-banner");
    if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
    if (dtPendingSpeechText) {
      var txt = dtPendingSpeechText;
      var cb = dtPendingSpeechCb;
      dtPendingSpeechText = null;
      dtPendingSpeechCb = null;
      setTimeout(function() {
        window.dtSpeakVietnamese(txt, cb);
      }, 80);
    }
  }

  document.addEventListener("pointerdown", dtUnlockAudioAndReplayPending, true);
  document.addEventListener("keydown", dtUnlockAudioAndReplayPending, true);

  // =========================================================================
  // 2. FULLSCREEN CONTROLLER
  // =========================================================================
  var manualExit = false;
  var autoTriggered = false;

  function isFullscreenNow() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }

  function enterFullscreenSafe() {
    if (isFullscreenNow()) return Promise.resolve(true);
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!req) return Promise.resolve(false);
    try {
      var res = req.call(el);
      if (res && typeof res.then === "function") {
        return res.then(function(){ return true; }).catch(function(){ return false; });
      }
      return Promise.resolve(true);
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function exitFullscreenSafe() {
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (!ex) return;
    try { ex.call(document); } catch (e) {}
  }

  window.dtToggleFullscreen = function(ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (isFullscreenNow()) {
      manualExit = true;
      exitFullscreenSafe();
    } else {
      manualExit = false;
      enterFullscreenSafe();
    }
  };

  function updateAllFullscreenButtons() {
    var active = isFullscreenNow();
    document.body.classList.toggle("dt-is-fullscreen", active);
    document.body.classList.toggle("eg-fullscreen-zoom", active);
    var btns = document.querySelectorAll("#eg-fs-toggle-btn, #dt-fs-floating-btn, #dt-elearning-fs-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].innerHTML = active ? "🗗 Thoát Full màn hình" : "⛶ Mở Full màn hình";
      btns[i].setAttribute("aria-pressed", active ? "true" : "false");
    }
    if (typeof window.scaleSlide === "function") {
      setTimeout(window.scaleSlide, 60);
      setTimeout(window.scaleSlide, 220);
    }
  }

  document.addEventListener("fullscreenchange", updateAllFullscreenButtons);
  document.addEventListener("webkitfullscreenchange", updateAllFullscreenButtons);
  window.addEventListener("resize", function(){
    if (typeof window.scaleSlide === "function") {
      window.scaleSlide();
    }
  });

  function ensureTopLeftControls() {
    var backBtn = document.getElementById("dt-portal-back-btn") || document.querySelector(".dt-portal-back-fab");
    if (!backBtn && !document.querySelector(".topbar .back-btn")) {
      backBtn = document.createElement("a");
      backBtn.id = "dt-portal-back-btn";
      backBtn.className = "dt-portal-back-fab";
      backBtn.href = "../../index.html";
      backBtn.innerHTML = "🏠 Cổng bài giảng";
      document.body.appendChild(backBtn);
    }

    var hasEgBtn = !!document.getElementById("eg-fs-toggle-btn");
    var topbar = document.querySelector(".topbar");
    if (topbar && !document.getElementById("dt-elearning-fs-btn")) {
      var fsBtn = document.createElement("button");
      fsBtn.id = "dt-elearning-fs-btn";
      fsBtn.type = "button";
      fsBtn.className = "dt-topbar-fs-btn";
      fsBtn.innerHTML = "⛶ Mở Full màn hình";
      fsBtn.onclick = window.dtToggleFullscreen;
      var slideCounter = topbar.querySelector(".slide-counter");
      if (slideCounter) {
        topbar.insertBefore(fsBtn, slideCounter);
      } else {
        topbar.appendChild(fsBtn);
      }
    } else if (!hasEgBtn && !topbar && !document.getElementById("dt-fs-floating-btn")) {
      var floatBtn = document.createElement("button");
      floatBtn.id = "dt-fs-floating-btn";
      floatBtn.type = "button";
      floatBtn.innerHTML = "⛶ Mở Full màn hình";
      floatBtn.onclick = window.dtToggleFullscreen;
      document.body.appendChild(floatBtn);
    }
    updateAllFullscreenButtons();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ensureTopLeftControls);
  } else {
    ensureTopLeftControls();
  }
  setTimeout(ensureTopLeftControls, 300);

  document.addEventListener("click", function(e) {
    if (manualExit || isFullscreenNow()) return;
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest("#dt-portal-back-btn, .dt-portal-back-fab, .back-btn, #eg-fs-toggle-btn, #dt-fs-floating-btn, #dt-elearning-fs-btn, #eg-class-picker-btn, #eg-picker-overlay")) {
      return;
    }
    if (!autoTriggered) {
      autoTriggered = true;
      enterFullscreenSafe().then(updateAllFullscreenButtons);
    } else if (t.closest(".btn-start-game, #start-btn, .spin-action-btn, .center-spin-btn, .rescue-opt-btn, .btn-choice, .ans, .btn-play")) {
      enterFullscreenSafe().then(updateAllFullscreenButtons);
    }
  }, true);
})();
</script>


<script>
(function(){
  // Watch #qModal in Wheel Game so when a question opens, it automatically reads the math & question clearly using dtSpeakVietnamese
  var modal = document.getElementById("qModal");
  if (!modal) return;

  function readWheelModalQuestion() {
    if (!modal.classList.contains("show")) return;
    var qEl = document.getElementById("modalQuestion");
    if (!qEl) return;
    var qTxt = (qEl.innerText || qEl.textContent || "").trim();
    if (!qTxt) return;
    var optBtns = document.querySelectorAll("#modalOptions .opt-btn");
    var optsSpeech = [];
    for (var i = 0; i < optBtns.length; i++) {
      var b = optBtns[i].querySelector(".opt-badge");
      var t = optBtns[i].querySelector(".opt-text");
      if (b && t) {
        optsSpeech.push("Đáp án " + (b.innerText || "").trim() + ": " + (t.innerText || "").trim());
      }
    }
    var fullSpeech = qTxt + (optsSpeech.length ? (". " + optsSpeech.join(". ")) : "");
    if (typeof window.dtSpeakVietnamese === "function") {
      window.dtSpeakVietnamese(fullSpeech);
    }
    var spkBtn = document.getElementById("btnSpeaker");
    if (spkBtn) {
      spkBtn.onclick = function(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        if (typeof window.dtSpeakVietnamese === "function") {
          window.dtSpeakVietnamese(fullSpeech);
        }
      };
    }
  }

  var obs = new MutationObserver(function(mutations) {
    for (var i = 0; i < mutations.length; i++) {
      if (mutations[i].attributeName === "class" && modal.classList.contains("show")) {
        setTimeout(readWheelModalQuestion, 120);
        break;
      }
    }
  });
  obs.observe(modal, { attributes: true });
})();
</script>
